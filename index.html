<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Esperanza · Macrociclo 1</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg: #17181a;
    --card: #212226;
    --card-border: #2d2e33;
    --ink: #f2f1ec;
    --ink-dim: #9b9ba3;
    --volt: #d4ff3d;
    --volt-dim: #9db82b;
    --teal: #33d9c4;
    --line: #35363b;
    --done: #2a3320;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; }
  body{ padding-bottom: 48px; }

  .topbar{
    position: sticky; top:0; z-index: 20;
    background: linear-gradient(180deg, var(--bg) 85%, transparent);
    padding: 14px 16px 6px;
  }
  .title{ font-family:'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.5px; color: var(--ink); line-height: 1; }
  .title span{ color: var(--volt); }
  .subtitle{ color: var(--ink-dim); font-size: 12px; margin-top: 2px; font-weight:500; }

  .tabs{ display:grid; grid-template-columns: repeat(3,1fr); gap:6px; margin-top: 12px; }
  .tab{
    background: var(--card); border:1px solid var(--card-border); color: var(--ink-dim);
    border-radius: 10px; padding: 8px 2px; text-align:center; font-weight:700; font-size: 11.5px;
    cursor:pointer; transition: all .15s ease; user-select:none;
  }
  .tab small{ display:block; font-weight:500; font-size:8.7px; margin-top:1px; letter-spacing:.2px; }
  .tab.active{ background: var(--volt); color:#14150f; border-color: var(--volt); }

  main{ padding: 10px 16px 0; max-width: 640px; margin:0 auto; }

  .day-head{ display:flex; align-items:baseline; justify-content:space-between; margin: 14px 2px 8px; }
  .day-head h2{ font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.3px; margin:0; }
  .progress{ font-size:12px; color: var(--ink-dim); font-weight:600; }

  .section-label{
    display:flex; align-items:center; gap:8px; margin: 18px 2px 8px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight:700; color: var(--ink-dim);
  }
  .section-label.warm::before{ content:''; width:8px; height:8px; border-radius:50%; background: var(--teal); display:inline-block; }
  .section-label.strength::before{ content:''; width:8px; height:8px; border-radius:50%; background: var(--volt); display:inline-block; }
  .section-label.cardio::before{ content:''; width:8px; height:8px; border-radius:50%; background: #ffb547; display:inline-block; }

  .card{
    background: var(--card); border:1px solid var(--card-border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px; transition: background .2s ease, border-color .2s ease;
  }
  .card.done{ background: var(--done); border-color: #3d4a2c; }

  .thumb{
    flex: 0 0 auto; width: 76px; height: 76px; border-radius: 14px; overflow:hidden;
    background: #17181a; border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb svg{ width:34px; height:34px; color: var(--volt-dim); }

  .thumb-btn{
    border:0; padding:0; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .thumb-btn:focus-visible{ outline:2px solid var(--volt); outline-offset:3px; border-radius:16px; }

  .check{
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line);
    display:flex; align-items:center; justify-content:center; margin-top:1px; cursor:pointer;
  }
  .card.done .check{ background: var(--volt); border-color: var(--volt); }
  .check svg{ display:none; width:13px; height:13px; }
  .card.done .check svg{ display:block; }

  .ex-name{ font-weight:700; font-size:15px; line-height:1.25; flex:1; }

  @media (max-width: 480px) {
    .card{ padding: 14px 12px; }
    .ex-card{ padding: 0; }
    .thumb{ width: 84px; height: 84px; border-radius: 16px; }
    .thumb svg{ width: 38px; height: 38px; }
    .check{ width: 30px; height: 30px; border-radius: 9px; }
    .ex-name{ font-size: 16px; }
    .video-btn{ padding: 10px 12px; font-size: 14px; }
  }
  .card.done .ex-name{ color: var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--volt-dim); }

  .stats{ display:flex; flex-wrap:wrap; gap: 6px 8px; margin-top: 9px; align-items:center; }
  .stat{ background: #17181a; border:1px solid var(--line); border-radius: 7px; padding: 4px 8px; font-size: 12px; font-weight:600; color: var(--ink); }
  .stat b{ color: var(--ink-dim); font-weight:600; margin-right:3px; }

  .kg-input{
    flex:1; background:#17181a; border:1.5px solid var(--line); border-radius:8px; color:var(--ink);
    font-size:14px; font-weight:700; padding:7px 8px; width: 100%; font-family:'Inter',sans-serif;
  }
  .kg-input:focus{ outline:none; border-color: var(--volt); }

  .ex-card{ padding:0; overflow:hidden; }
  .ex-photo-wrap{ position:relative; }
  .ex-photo{
    display:block; width:100%; border:0; padding:0; margin:0; background:transparent; cursor:pointer;
  }
  .ex-photo-frame{ width:100%; aspect-ratio:4/3; overflow:hidden; background:#17181a; display:flex; align-items:center; justify-content:center; }
  .ex-photo-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ex-photo-frame svg{ width:56px; height:56px; color: var(--volt-dim); }
  .ex-card.done .ex-photo-frame{ filter: grayscale(.55) brightness(.5); }

  .check-overlay{
    position:absolute; top:10px; right:10px; margin-top:0; z-index:2;
    background: rgba(23,24,26,.45); border-color: rgba(242,241,236,.55);
  }
  .ex-play-hint{
    position:absolute; bottom:10px; left:10px; width:34px; height:34px; border-radius:50%;
    background: rgba(20,21,15,.55); display:flex; align-items:center; justify-content:center; pointer-events:none;
  }
  .ex-play-hint svg{ width:16px; height:16px; color: var(--volt); }

  .ex-done-badge{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none;
  }
  .ex-card.done .ex-done-badge{ display:flex; }
  .ex-done-badge span{ width:56px; height:56px; border-radius:50%; background: var(--volt); display:flex; align-items:center; justify-content:center; }
  .ex-done-badge svg{ width:28px; height:28px; }

  .ex-body{ padding:12px 14px; }

  .sets-grid{ margin-top:9px; display:flex; flex-direction:column; gap:6px; }
  .set-row{ display:flex; align-items:center; gap:6px; background:#17181a; border:1px solid var(--line); border-radius:8px; padding:5px 8px; }
  .set-row .set-label{ font-size:11px; color:var(--ink-dim); font-weight:700; width:50px; flex:0 0 auto; }
  .set-row input{ width:100%; min-width:0; background:transparent; border:0; color:var(--ink); font-size:13px; font-weight:700; font-family:'Inter',sans-serif; text-align:center; padding:4px 2px; }
  .set-row input:focus{ outline:none; }
  .set-row .unit{ font-size:10px; color:var(--ink-dim); flex:0 0 auto; }
  .set-row .sep{ color:var(--ink-dim); font-size:12px; flex:0 0 auto; }

  .note-input{
    margin-top:8px; width:100%; background:#17181a; border:1.5px solid var(--line); border-radius:8px;
    color:var(--ink); font-size:13px; padding:8px 10px; font-family:'Inter',sans-serif;
  }
  .note-input:focus{ outline:none; border-color: var(--volt); }
  .note-input::placeholder{ color: var(--ink-dim); }

  .video-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top: 10px; text-decoration:none;
    background: transparent; border: 1.5px solid var(--volt); color: var(--volt);
    border-radius: 10px; padding: 8px 10px; font-weight:700; font-size: 13.5px;
  }
  .video-btn:active{ background: var(--volt); color:#14150f; }
  .video-btn svg{ width:15px; height:15px; }

  .cardio-row{ display:flex; gap:8px; margin-top:9px; }
  .cardio-field{ flex:1; }
  .cardio-field label{ display:block; font-size:11px; color:var(--ink-dim); font-weight:700; margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
  select.kg-input{ appearance:none; -webkit-appearance:none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239b9ba3'><path d='M7 10l5 5 5-5z'/></svg>"); background-repeat:no-repeat; background-position: right 8px center; background-size:16px; padding-right:28px; }

  .hist-day{ margin-bottom: 16px; }
  .hist-date{ font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:.5px; color:var(--ink-dim); margin: 4px 2px 6px; display:flex; align-items:center; gap:8px; }
  .hist-date .chip{ font-family:'Inter',sans-serif; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:20px; background:var(--volt); color:#14150f; }
  .hist-item-block{ padding:6px 2px; border-bottom:1px solid var(--card-border); }
  .hist-item-block:last-child{ border-bottom:none; }
  .hist-item{ display:flex; justify-content:space-between; gap:10px; font-size:13.5px; }
  .hist-item .n{ font-weight:600; }
  .hist-item .v{ font-weight:800; color: var(--ink); text-align:right; }
  .hist-note{ font-size:12px; color:var(--ink-dim); font-style:italic; margin-top:2px; }
  .empty-hist{ color:var(--ink-dim); font-size:13px; text-align:center; padding: 30px 20px; }

  .info-table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:12.5px; }
  .info-table th{ text-align:left; color:var(--ink-dim); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; padding:4px 6px; border-bottom:1px solid var(--line); }
  .info-table td{ padding:5px 6px; border-bottom:1px solid var(--card-border); color:var(--ink); }
  .info-table tr:last-child td{ border-bottom:0; }
  .info-table td.num{ text-align:right; font-weight:700; }

  footer{ text-align:center; color: var(--ink-dim); font-size: 11px; margin-top: 26px; padding: 0 16px; }
  footer b{ color: var(--volt); }
  .storage-note{ background:#2b2410; border:1px solid #4a3d1a; color:#e8cf7a; font-size:11.5px; border-radius:10px; padding:8px 10px; margin: 10px 2px; }
  .sync-error{ background:#3a1414; border:1px solid #5c1f1f; color:#f2a8a8; }

  .preview-modal{
    position: fixed; inset: 0; z-index: 60; display:flex; align-items:center; justify-content:center;
    padding: 18px; background: rgba(7, 8, 10, 0.82); backdrop-filter: blur(6px);
    opacity:0; pointer-events:none; transition: opacity .2s ease;
  }
  .preview-modal.active{ opacity:1; pointer-events:auto; }
  .preview-panel{
    width:min(92vw, 430px); background:var(--card); border:1px solid var(--card-border);
    border-radius: 20px; padding: 16px; box-shadow: 0 20px 44px rgba(0,0,0,0.35);
  }
  .preview-header{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .preview-title{ font-weight:800; font-size:16px; line-height:1.2; }
  .preview-close{ border:0; background:transparent; color:var(--ink-dim); font-size:22px; line-height:1; cursor:pointer; }
  .preview-media{ border-radius:14px; overflow:hidden; background:#17181a; border:1px solid var(--line); min-height:220px; display:flex; align-items:center; justify-content:center; aspect-ratio: 16/9; }
  .preview-media img{ width:100%; height:100%; object-fit:cover; display:block; }
  .preview-media iframe{ width:100%; height:100%; border:0; display:block; }
  .preview-media svg{ width:72px; height:72px; color:var(--volt-dim); }
  .preview-meta{ margin-top:10px; color:var(--ink-dim); font-size:13px; }
  .preview-actions{ display:flex; gap:8px; margin-top:12px; }
  .preview-btn{
    flex:1; border:0; border-radius:10px; padding:10px 12px; font-weight:700; font-size:13px;
    background: var(--volt); color:#14150f; text-decoration:none; text-align:center;
  }
  .preview-btn.secondary{ background: transparent; color: var(--volt); border:1.5px solid var(--volt); }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">ESPERANZA <span>· BLOQUE 1</span></div>
  <div class="subtitle">Ars Fitness Personal Training — Julio 2026</div>
  <div class="tabs" id="tabs"></div>
</div>

<main id="main"></main>

<div class="preview-modal" id="preview-modal" aria-hidden="true">
  <div class="preview-panel" role="dialog" aria-modal="true" aria-label="Vista previa del ejercicio">
    <div class="preview-header">
      <div class="preview-title" id="preview-title">Ejercicio</div>
      <button class="preview-close" type="button" id="preview-close" aria-label="Cerrar vista previa">×</button>
    </div>
    <div class="preview-media" id="preview-media"></div>
    <div class="preview-meta" id="preview-meta"></div>
    <div class="preview-actions">
      <a class="preview-btn secondary" id="preview-open" href="#" target="_blank" rel="noopener">Abrir vídeo</a>
      <button class="preview-btn" type="button" id="preview-close-btn">Cerrar</button>
    </div>
  </div>
</div>

<footer>Toca <b>▢</b> para marcar un ejercicio hecho. Los kg, reps, notas y el cardio se guardan por día y quedan en <b>Historial</b>.</footer>

<script>

function iconSvg(inner){
  return `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}
const HEAD = `<circle cx="{cx}" cy="{cy}" r="4" fill="currentColor" stroke="none"/>`;
function head(cx,cy){ return HEAD.replace('{cx}',cx).replace('{cy}',cy); }

const ICONX = {
  squat: iconSvg(head(24,8) + `<path d="M14 12h20"/><path d="M24 12v14"/><path d="M24 26l-6 8v8"/><path d="M24 26l3 9-1 7"/>`),
  splitsquat: iconSvg(head(24,8) + `<path d="M24 12v14"/><path d="M24 26v14"/><path d="M24 26l12 10"/>`),
  legpress: iconSvg(head(10,20) + `<path d="M10 24h16"/><path d="M26 24l8-8"/><path d="M34 16v22"/>`),

  deadlift: iconSvg(head(24,8) + `<path d="M24 12l-8 14"/><path d="M16 26v14"/><path d="M24 12l-2 26"/><path d="M8 40h18"/>`),
  tricep: iconSvg(head(24,6) + `<path d="M24 10v10"/><path d="M24 10v22"/><path d="M24 20l-6 4"/>`),
  glutekick: iconSvg(`<path d="M8 22h16"/><path d="M8 22v14M16 22v14"/><path d="M24 22l12-10"/>`),
  adductor: iconSvg(head(24,8) + `<path d="M24 12v14"/><path d="M14 38l10-12"/><path d="M34 38l-10-12"/><path d="M11 32l3 4M37 32l-3 4"/>`),
  bicep: iconSvg(head(24,8) + `<path d="M24 12v14"/><path d="M24 26l-8 8"/><path d="M16 34l6-10"/>`)
};

function ytId(url){
  const m = url.match(/(?:v=|shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{6,15})/);
  return m ? m[1] : null;
}
function thumbHtml(ex){
  if(ex.photo){
    return `<img src="${encodeURI(ex.photo)}" alt="${ex.name}" loading="lazy">`;
  }
  const id = ytId(ex.video);
  if(id){
    return `<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="${ex.name}" loading="lazy">`;
  }
  return ICONX[ex.icon] || ICONX.squat;
}
function escapeAttr(value){
  return String(value || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

    warmup:[

      {name:"Face pull", series:"2", rep:"14-18", recp:"1,5’", int:"9/10", icon:"facepull", video:"https://www.sergiomcoach.com/topics/13-facepull-2/", photo:"fotos/face pull.png"},

// write fails, syncError holds a message the UI shows until the next call succeeds,
// so a failed save is always visible instead of silently vanishing.
let syncError = null;
const NO_DB_MSG = 'No hay conexión con la base de datos: no se puede leer ni guardar nada ahora mismo.';

async function getLog(day, date){
  if(!sb){ syncError = NO_DB_MSG; return { weights:{}, cardio:{ minutes:"", machine:"" }, done:{}, sets:{}, notes:{} }; }
  try{
    const { data, error } = await sb.from('workout_logs').select('weights,cardio,done,sets,notes').eq('day', day).eq('log_date', date).maybeSingle();
    if(error) throw error;
    syncError = null;
    if(!data) return { weights:{}, cardio:{ minutes:"", machine:"" }, done:{}, sets:{}, notes:{} };
    return { weights: data.weights||{}, cardio: data.cardio||{minutes:"",machine:""}, done: data.done||{}, sets: data.sets||{}, notes: data.notes||{} };
  }catch(e){
    syncError = 'No se pudo cargar tu progreso de hoy: revisa la conexión y recarga la página.';
    return { weights:{}, cardio:{ minutes:"", machine:"" }, done:{}, sets:{}, notes:{} };
  }
}

async function saveLog(day, date, logObj){
  if(!sb){ syncError = NO_DB_MSG; return; }
  try{
    const { error } = await sb.from('workout_logs').upsert(
      { day, log_date: date, weights: logObj.weights, cardio: logObj.cardio, done: logObj.done, sets: logObj.sets||{}, notes: logObj.notes||{}, updated_at: new Date().toISOString() },
      { onConflict: 'day,log_date' }
    );
    if(error) throw error;
    syncError = null;
  }catch(e){
    syncError = 'No se pudo guardar este cambio: revisa tu conexión e inténtalo de nuevo.';
  }
}

async function listAllLogs(){
  if(!sb){ syncError = NO_DB_MSG; return []; }
  try{
    const { data, error } = await sb.from('workout_logs').select('day,log_date,weights,cardio,done,sets,notes').order('log_date',{ascending:false});
    if(error) throw error;
    syncError = null;
    return (data||[]).map(r => ({ day: r.day, date: r.log_date, weights: r.weights||{}, cardio: r.cardio||{}, done: r.done||{}, sets: r.sets||{}, notes: r.notes||{} }));
  }catch(e){
    syncError = 'No se pudo cargar el historial: revisa tu conexión.';
    return [];
  }
}

function openPreview(ex){
  previewTitleEl.textContent = ex.name;
  previewMetaEl.textContent = `${ex.series || ''}x${ex.rep || ''}${ex.recp ? ' · ' + ex.recp : ''}`.trim();
  previewOpenEl.href = ex.video || '#';
  previewOpenEl.style.display = ex.video ? 'inline-flex' : 'none';

  const id = ytId(ex.video || '');
  if(id){
    previewMediaEl.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&autoplay=1" title="${escapeAttr(ex.name)}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  } else if(ex.photo){
    previewMediaEl.innerHTML = `<img src="${encodeURI(ex.photo)}" alt="${escapeAttr(ex.name)}" loading="eager">`;
  } else {
    // The sergiomcoach.com videos are hosted on Vimeo with embedding locked to their own domain
    // (Vimeo's domain-privacy setting), so they can't be embedded here — fall back to the icon
    // and rely on the "Abrir vídeo" button to open the source page instead.
    previewMediaEl.innerHTML = `<div class="thumb">${ICONX[ex.icon] || ICONX.squat}</div>`;
  }

  previewModal.classList.add('active');
  previewModal.setAttribute('aria-hidden','false');
}

function closePreview(){
  previewModal.classList.remove('active');
  previewModal.setAttribute('aria-hidden','true');
  previewMediaEl.innerHTML = ''; // stop any playing video
}

previewModal.addEventListener('click', (e)=>{ if(e.target === previewModal) closePreview(); });

async function getPrevBestSets(day, excludeDate){
  const logs = (await listAllLogs())
    .filter(l => l.day === day && l.date !== excludeDate)
    .sort((a,b) => b.date.localeCompare(a.date));
  const result = {};
  DATA[day].strength.forEach((ex, idx)=>{
    for(const l of logs){
      const arr = (l.sets && l.sets[idx]) || [];
      const valid = arr.filter(s => s && (s.kg || s.reps));
      if(valid.length){
        const top = valid.reduce((best,s) => (parseFloat(s.kg)||0) > (parseFloat(best.kg)||0) ? s : best, valid[0]);
        result[idx] = { kg: top.kg, reps: top.reps, date: l.date };
        break;
      }
    }
  });
  return result;
}

function pendingFirst(list, prefix, doneMap){
  return list.map((_,i)=>i).sort((a,b)=>{
    const da = !!doneMap[`${prefix}-${a}`];
    const db = !!doneMap[`${prefix}-${b}`];
    if(da === db) return a-b;
    return da ? 1 : -1;
  });
}

  const doneCount = [...d.warmup.keys()].filter(i=>doneMap[`warm-${i}`]).length

  mainEl.querySelectorAll('.check').forEach(chk=>{
    chk.addEventListener('click', async ()=>{
      const card = chk.closest('.card');
      const subKey = card.dataset.key.slice(day.length + 1); // strip "${day}-" prefix -> "warm-0" / "strength-2"
      const fresh = await getLog(day, date);
      fresh.done = fresh.done || {};
      fresh.done[subKey] = !fresh.done[subKey];
      await saveLog(day, date, fresh);
      await renderMain();
    });
  });

  mainEl.querySelectorAll('.thumb-btn').forEach(btn=>{

      openPreview({
        name: btn.dataset.name,
        video: btn.dataset.video,
        series: btn.dataset.series,

        recp: btn.dataset.recp,
        icon: btn.dataset.icon,
        photo: btn.dataset.photo

  mainEl.querySelectorAll('[data-ex-idx][data-set-i]').forEach(inp=>{

      fresh.sets = fresh.sets || {};

      fresh.sets[idx] = arr;

      refreshSyncBanner();
    });
  });

  const minutesEl = mainEl.querySelector('#cardio-minutes');
  const machineEl = mainEl.querySelector('#cardio-machine');
  async function saveCardio(){
    const fresh = await getLog(day, date);
    fresh.cardio = { minutes: minutesEl.value, machine: machineEl.value };
    await saveLog(day, date, fresh);
    refreshSyncBanner();
  }
  if(minutesEl) minutesEl.addEventListener('change', saveCardio);
  if(machineEl) machineEl.addEventListener('change', saveCardio);
}

function mondayOf(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const dow = (d.getDay() + 6) % 7; // Mon=0..Sun=6
  d.setDate(d.getDate() - dow);
  return d;
}
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function isoWeekKey(dateStr){ return dateKey(mondayOf(dateStr)); }
function lastNWeekKeys(n){
  const mondayToday = mondayOf(todayStr());
  const out = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(mondayToday);
    d.setDate(mondayToday.getDate() - i*7);
    out.push(dateKey(d));
  }
  return out;
}
function weekLabel(weekKey){
  const d = new Date(weekKey + 'T00:00:00');
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

async function renderHistory(){
  const entries = await listAllLogs();
  entries.sort((a,b)=> b.date.localeCompare(a.date));

  mainEl.innerHTML = `<div class="day-head"><h2>Historial</h2></div>${syncError ? `<div class="storage-note sync-error">${syncError}</div>` : ''}<div id="hist-body"></div>`;
  const body = mainEl.querySelector('#hist-body');

  if(entries.length === 0){
    body.innerHTML = `<div class="empty-hist">Todavía no has guardado ningún kg ni cardio.</div>`;
    return;
  }

  body.innerHTML = entries.map(e=>{
    const d = DATA[e.day];
    // Legacy entries (pre-sets/reps/notes) only ever have a single kg per exercise in "weights".
    const weightRows = Object.entries(e.weights || {})
      .filter(([idx,val]) => val !== undefined && val !== null && val !== "")
      .map(([idx,val]) => `<div class="hist-item-block"><div class="hist-item"><span class="n">${d.strength[idx] ? d.strength[idx].name : ('Ejercicio '+idx)}</span><span class="v">${val} kg</span></div></div>`)
      .join('');
    const setsRows = Object.entries(e.sets || {})
      .filter(([idx,arr]) => Array.isArray(arr) && arr.some(s => s && (s.kg || s.reps)))
      .map(([idx,arr])=>{
        const name = d.strength[idx] ? d.strength[idx].name : ('Ejercicio '+idx);
        const setsText = arr.filter(s => s && (s.kg || s.reps)).map(s => `${s.kg||'-'}kg×${s.reps||'-'}`).join(' · ');
        const note = e.notes && e.notes[idx] ? `<div class="hist-note">${escapeAttr(e.notes[idx])}</div>` : '';
        return `<div class="hist-item-block"><div class="hist-item"><span class="n">${name}</span><span class="v">${setsText}</span></div>${note}</div>`;
      })
      .join('');
    const cardioRow = (e.cardio && (e.cardio.minutes || e.cardio.machine))
      ? `<div class="hist-item-block"><div class="hist-item"><span class="n">Cardio ${e.cardio.machine||''}</span><span class="v">${e.cardio.minutes||'0'} min</span></div></div>`
      : '';
    const body2 = weightRows + setsRows + cardioRow;
    return `
      <div class="hist-day">
        <div class="hist-date">${e.date} <span class="chip">${d.label} · ${d.sub}</span></div>
        ${body2 || '<div class="empty-hist" style="padding:10px 2px;">Sin datos guardados ese día.</div>'}
      </div>`;
  }).join('');
}

async function renderInformes(){
  const logs = await listAllLogs();

  mainEl.innerHTML = `<div class="day-head"><h2>Informes</h2></div>${syncError ? `<div class="storage-note sync-error">${syncError}</div>` : ''}<div id="informes-body"></div>`;
  const body = mainEl.querySelector('#informes-body');

  // Group by exercise name across all days — a session is a session, wherever it fell in the routine.
  const exerciseRefs = new Map();
  DAY_ORDER.forEach(day=>{
    DATA[day].strength.forEach((ex, idx)=>{
      if(!exerciseRefs.has(ex.name)) exerciseRefs.set(ex.name, []);
      exerciseRefs.get(ex.name).push({ day, idx });
    });
  });

  const exerciseBlocks = [...exerciseRefs.entries()].map(([name, refs])=>{
    const history = logs
      .flatMap(l => refs.filter(r => r.day === l.day && l.sets && l.sets[r.idx]).map(r=>({ l, idx: r.idx })))
      .map(({l, idx}) => {
        const setsArr = (l.sets[idx] || []).filter(s => s && (s.kg || s.reps));
        if(!setsArr.length) return null;
        const top = setsArr.reduce((best,s) => (parseFloat(s.kg)||0) > (parseFloat(best.kg)||0) ? s : best, setsArr[0]);
        return { date: l.date, kg: top.kg || '-', reps: top.reps || '-' };
      })
      .filter(Boolean)
      .sort((a,b) => b.date.localeCompare(a.date));

    const rows = history.length
      ? history.map(h => `<tr><td>${h.date}</td><td class="num">${h.kg}</td><td class="num">${h.reps}</td></tr>`).join('')
      : `<tr><td colspan="3" style="color:var(--ink-dim); text-align:center; padding:10px 0;">Sin sesiones registradas</td></tr>`;

    return `
      <div class="card">
        <div class="ex-name" style="font-size:14px;">${name}</div>
        <table class="info-table">
          <thead><tr><th>Fecha</th><th>Kg</th><th>Reps</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }).join('');

  const weeks = lastNWeekKeys(8);
  const cardioByWeek = {};
  weeks.forEach(w => cardioByWeek[w] = 0);
  logs.forEach(l => {
    const mins = Number(l.cardio && l.cardio.minutes) || 0;
    if(!mins) return;
    const wk = isoWeekKey(l.date);
    if(wk in cardioByWeek) cardioByWeek[wk] += mins;
  });
  const cardioRows = weeks.map(w => `<tr><td>Semana del ${weekLabel(w)}</td><td class="num">${cardioByWeek[w]}</td></tr>`).join('');

  body.innerHTML = `
    <div class="section-label strength">Progresión por ejercicio</div>
    ${exerciseBlocks}
    <div class="section-label cardio">Cardio semanal</div>
    <div class="card">
      <table class="info-table">
        <thead><tr><th>Semana</th><th>Minutos</th></tr></thead>
        <tbody>${cardioRows}</tbody>
      </table>
    </div>
  `;
}

renderTabs();
renderMain();
</script>
</body>
</html>
