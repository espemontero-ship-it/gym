<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Esperanza · Macrociclo 1</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg: #17181a;
    --card: #212226;
    --card-border: #2d2e33;
    --ink: #f2f1ec;
    --ink-dim: #9b9ba3;
    --volt: #d4ff3d;
    --volt-dim: #9db82b;
    --teal: #33d9c4;
    --line: #35363b;
    --done: #2a3320;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; }
  body{ padding-bottom: 48px; }

  .topbar{
    position: sticky; top:0; z-index: 20;
    background: linear-gradient(180deg, var(--bg) 85%, transparent);
    padding: 10px 16px 4px;
  }
  .title{ font-family:'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.5px; color: var(--ink); line-height: 1; }
  .title span{ color: var(--volt); }

  .tabs{ display:grid; grid-template-columns: repeat(3,1fr); gap:6px; margin-top: 8px; }
  .tab{
    background: var(--card); border:1px solid var(--card-border); color: var(--ink-dim);
    border-radius: 10px; padding: 5px 2px; text-align:center; font-weight:700; font-size: 11.5px;
    cursor:pointer; transition: all .15s ease; user-select:none;
  }
  .tab.active{ background: var(--volt); color:#14150f; border-color: var(--volt); }

  .topbar-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .mode-switch{ display:flex; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:3px; gap:3px; }
  .mode-btn{ flex:1; background:transparent; border:0; color:var(--ink-dim); border-radius:7px; padding:7px 8px; font-weight:700; font-size:12.5px; cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap; }
  .mode-btn.active{ background:var(--volt); color:#14150f; }

  main{ padding: 10px 16px 0; max-width: 640px; margin:0 auto; }

  .day-head{ display:flex; align-items:baseline; justify-content:space-between; margin: 14px 2px 8px; }
  .day-head h2{ font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.3px; margin:0; }
  .progress{ font-size:12px; color: var(--ink-dim); font-weight:600; }

  .section-label{
    display:flex; align-items:center; gap:8px; margin: 18px 2px 8px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight:700; color: var(--ink-dim);
  }
  .section-label.warm::before{ content:''; width:8px; height:8px; border-radius:50%; background: var(--teal); display:inline-block; }
  .section-label.strength::before{ content:''; width:8px; height:8px; border-radius:50%; background: var(--volt); display:inline-block; }
  .section-label.cardio::before{ content:''; width:8px; height:8px; border-radius:50%; background: #ffb547; display:inline-block; }

  .card{
    background: var(--card); border:1px solid var(--card-border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px; transition: background .2s ease, border-color .2s ease;
  }
  .card.done{ background: var(--done); border-color: #3d4a2c; }

  .thumb{
    flex: 0 0 auto; width: 76px; height: 76px; border-radius: 14px; overflow:hidden;
    background: #17181a; border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb svg{ width:34px; height:34px; color: var(--volt-dim); }

  .thumb-btn{
    border:0; padding:0; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .thumb-btn:focus-visible{ outline:2px solid var(--volt); outline-offset:3px; border-radius:16px; }

  .check{
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line);
    display:flex; align-items:center; justify-content:center; margin-top:1px; cursor:pointer;
  }
  .card.done .check{ background: var(--volt); border-color: var(--volt); }
  .check svg{ display:none; width:13px; height:13px; }
  .card.done .check svg{ display:block; }

  .ex-name{ font-weight:700; font-size:15px; line-height:1.25; flex:1; }

  @media (max-width: 480px) {
    .card{ padding: 14px 12px; }
    .ex-card{ padding: 0; }
    .thumb{ width: 84px; height: 84px; border-radius: 16px; }
    .thumb svg{ width: 38px; height: 38px; }
    .check{ width: 30px; height: 30px; border-radius: 9px; }
    .ex-name{ font-size: 16px; }
    .video-btn{ padding: 10px 12px; font-size: 14px; }
  }
  .card.done .ex-name{ color: var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--volt-dim); }

  .stats{ display:flex; flex-wrap:wrap; gap: 6px 8px; margin-top: 9px; align-items:center; }
  .stat{ background: #17181a; border:1px solid var(--line); border-radius: 7px; padding: 4px 8px; font-size: 12px; font-weight:600; color: var(--volt); }
  .stat b{ color: var(--volt); font-weight:600; margin-right:3px; }

  .kg-input{
    flex:1; background:#17181a; border:1.5px solid var(--line); border-radius:8px; color:var(--ink);
    font-size:14px; font-weight:700; padding:7px 8px; width: 100%; font-family:'Inter',sans-serif;
  }
  .kg-input:focus{ outline:none; border-color: var(--volt); }

  .ex-card{ padding:0; overflow:hidden; }
  .ex-photo-wrap{ position:relative; }
  .ex-photo{
    display:block; width:100%; border:0; padding:0; margin:0; background:transparent; cursor:pointer;
  }
  .ex-photo-frame{ width:100%; aspect-ratio:4/3; overflow:hidden; background:#17181a; display:flex; align-items:center; justify-content:center; }
  .ex-photo-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ex-photo-frame svg{ width:56px; height:56px; color: var(--volt-dim); }
  .ex-card.done .ex-photo-frame{ filter: grayscale(.55) brightness(.5); }

  .ex-photo-wrap--square{ width:150px; margin:14px auto 0; }
  .ex-photo-wrap--square .ex-photo-frame{ width:150px; aspect-ratio:1/1; border-radius:12px; }
  .card-strength .check-overlay{ border-color: var(--volt); }
  .card-warm .check-overlay{ border-color: var(--teal); }

  .check-overlay{
    position:absolute; top:10px; right:10px; margin-top:0; z-index:2;
    background: rgba(23,24,26,.45); border-color: rgba(242,241,236,.55);
  }
  .ex-play-hint{
    position:absolute; bottom:10px; left:10px; width:34px; height:34px; border-radius:50%;
    background: rgba(20,21,15,.55); display:flex; align-items:center; justify-content:center; pointer-events:none;
  }
  .ex-play-hint svg{ width:16px; height:16px; }
  .card-strength .ex-play-hint svg{ color: var(--volt); }
  .card-warm .ex-play-hint svg{ color: var(--teal); }

  .ex-done-badge{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none;
  }
  .ex-card.done .ex-done-badge{ display:flex; }
  .ex-done-badge span{ width:56px; height:56px; border-radius:50%; background: var(--volt); display:flex; align-items:center; justify-content:center; }
  .ex-done-badge svg{ width:28px; height:28px; }

  .ex-body{ padding:12px 14px; }
  .ex-body .ex-name{ font-size:17px; }

  .prev-history{
    font-size:13px; font-weight:400; color:var(--ink); margin-top:8px; line-height:1.5;
  }
  .prev-history b{ font-weight:700; margin-right:4px; }
  .ex-tips summary{ list-style:none; cursor:pointer; font-weight:700; }
  .ex-tips summary::-webkit-details-marker{ display:none; }
  .ex-tips summary::before{ content:'▸ '; }
  .ex-tips[open] summary::before{ content:'▾ '; }
  .ex-tips ul{ margin:4px 0 0; padding-left:18px; }
  .ex-tips li + li{ margin-top:4px; }

  .sets-grid{ margin-top:10px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .set-row{ display:flex; align-items:center; gap:6px; padding:7px 10px; }
  .set-row + .set-row{ border-top:1px solid var(--line); }
  .set-row .set-label{ font-size:13px; color:var(--ink); font-weight:700; width:50px; flex:0 0 auto; }
  .set-row input{ width:100%; min-width:0; background:transparent; border:0; color:var(--ink); font-size:13px; font-weight:700; font-family:'Inter',sans-serif; text-align:center; padding:4px 2px; }
  .set-row input:focus{ outline:none; }
  .set-row .unit{ font-size:13px; color:var(--ink); flex:0 0 auto; }
  .set-row .sep{ color:var(--ink); font-size:13px; flex:0 0 auto; }

  .note-input{
    margin-top:9px; width:100%; background:transparent; border:0; border-bottom:1.5px solid var(--line);
    color:var(--ink); font-size:13px; padding:4px 2px; font-family:'Inter',sans-serif;
  }
  .note-input:focus{ outline:none; border-bottom-color: var(--volt); }
  .note-input::placeholder{ color: var(--ink-dim); }

  .video-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top: 10px; text-decoration:none;
    background: transparent; border: 1.5px solid var(--volt); color: var(--volt);
    border-radius: 10px; padding: 8px 10px; font-weight:700; font-size: 13.5px;
  }
  .video-btn:active{ background: var(--volt); color:#14150f; }
  .video-btn svg{ width:15px; height:15px; }

  .cardio-row{ display:flex; gap:8px; margin-top:9px; }
  .cardio-field{ flex:1; }
  .cardio-field label{ display:block; font-size:11px; color:var(--ink-dim); font-weight:700; margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
  select.kg-input{ appearance:none; -webkit-appearance:none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239b9ba3'><path d='M7 10l5 5 5-5z'/></svg>"); background-repeat:no-repeat; background-position: right 8px center; background-size:16px; padding-right:28px; }

  .hist-day{ margin-bottom: 16px; }
  .hist-date{ font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:.5px; color:var(--ink-dim); margin: 4px 2px 6px; display:flex; align-items:center; gap:8px; }
  .hist-date .chip{ font-family:'Inter',sans-serif; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:20px; background:var(--volt); color:#14150f; }
  .hist-item-block{ padding:6px 2px; border-bottom:1px solid var(--card-border); }
  .hist-item-block:last-child{ border-bottom:none; }
  .hist-item{ display:flex; justify-content:space-between; gap:10px; font-size:13.5px; }
  .hist-item .n{ font-weight:600; }
  .hist-item .v{ font-weight:800; color: var(--ink); text-align:right; }
  .hist-note{ font-size:12px; color:var(--ink-dim); font-style:italic; margin-top:2px; }
  .empty-hist{ color:var(--ink-dim); font-size:13px; text-align:center; padding: 30px 20px; }

  .info-table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:12.5px; }
  .info-table th{ text-align:left; color:var(--ink-dim); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; padding:4px 6px; border-bottom:1px solid var(--line); }
  .info-table td{ padding:5px 6px; border-bottom:1px solid var(--card-border); color:var(--ink); }
  .info-table tr:last-child td{ border-bottom:0; }
  .info-table td.num{ text-align:right; font-weight:700; }
  .info-input{
    width:44px; background:transparent; border:1px solid var(--line); border-radius:6px; color:var(--ink);
    font-size:12.5px; font-weight:700; font-family:'Inter',sans-serif; text-align:right; padding:3px 4px;
  }
  .info-input:focus{ outline:none; border-color:var(--volt); }

  footer{ text-align:center; color: var(--ink-dim); font-size: 11px; margin-top: 26px; padding: 0 16px; }
  footer b{ color: var(--volt); }
  .storage-note{ background:#2b2410; border:1px solid #4a3d1a; color:#e8cf7a; font-size:11.5px; border-radius:10px; padding:8px 10px; margin: 10px 2px; }
  .sync-error{ background:#3a1414; border:1px solid #5c1f1f; color:#f2a8a8; }

  .preview-modal{
    position: fixed; inset: 0; z-index: 60; display:flex; align-items:center; justify-content:center;
    padding: 18px; background: rgba(7, 8, 10, 0.82); backdrop-filter: blur(6px);
    opacity:0; pointer-events:none; transition: opacity .2s ease;
  }
  .preview-modal.active{ opacity:1; pointer-events:auto; }
  .preview-panel{
    width:min(92vw, 430px); background:var(--card); border:1px solid var(--card-border);
    border-radius: 20px; padding: 16px; box-shadow: 0 20px 44px rgba(0,0,0,0.35);
  }
  .preview-header{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .preview-title{ font-weight:800; font-size:16px; line-height:1.2; }
  .preview-close{ border:0; background:transparent; color:var(--ink-dim); font-size:22px; line-height:1; cursor:pointer; }
  .preview-media{ border-radius:14px; overflow:hidden; background:#17181a; border:1px solid var(--line); min-height:220px; display:flex; align-items:center; justify-content:center; aspect-ratio: 16/9; }
  .preview-media img{ width:100%; height:100%; object-fit:cover; display:block; }
  .preview-media iframe{ width:100%; height:100%; border:0; display:block; }
  .preview-media svg{ width:72px; height:72px; color:var(--volt-dim); }
  .preview-meta{ margin-top:10px; color:var(--ink-dim); font-size:13px; }
  .preview-actions{ display:flex; gap:8px; margin-top:12px; }
  .preview-btn{
    flex:1; border:0; border-radius:10px; padding:10px 12px; font-weight:700; font-size:13px;
    background: var(--volt); color:#14150f; text-decoration:none; text-align:center;
  }
  .preview-btn.secondary{ background: transparent; color: var(--volt); border:1.5px solid var(--volt); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-head">
    <div class="title">ESPERANZA</div>
    <div class="mode-switch" id="mode-switch"></div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<main id="main"></main>

<div class="preview-modal" id="preview-modal" aria-hidden="true">
  <div class="preview-panel" role="dialog" aria-modal="true" aria-label="Vista previa del ejercicio">
    <div class="preview-header">
      <div class="preview-title" id="preview-title">Ejercicio</div>
      <button class="preview-close" type="button" id="preview-close" aria-label="Cerrar vista previa">×</button>
    </div>
    <div class="preview-media" id="preview-media"></div>
    <div class="preview-meta" id="preview-meta"></div>
    <div class="preview-actions">
      <a class="preview-btn secondary" id="preview-open" href="#" target="_blank" rel="noopener">Abrir vídeo</a>
      <button class="preview-btn" type="button" id="preview-close-btn">Cerrar</button>
    </div>
  </div>
</div>

<footer id="footer-note">Toca <b>▢</b> para marcar un ejercicio hecho. Los kg, reps, notas y el cardio se guardan por día y quedan en <b>Historial</b>.</footer>

<script>
// ---------- icon library (used when there's no real video thumbnail available) ----------
function iconSvg(inner){
  return `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}
const HEAD = `<circle cx="{cx}" cy="{cy}" r="4" fill="currentColor" stroke="none"/>`;
function head(cx,cy){ return HEAD.replace('{cx}',cx).replace('{cy}',cy); }

const ICONX = {
  squat: iconSvg(head(24,8) + `<path d="M14 12h20"/><path d="M24 12v14"/><path d="M24 26l-6 8v8"/><path d="M24 26l3 9-1 7"/>`),
  splitsquat: iconSvg(head(24,8) + `<path d="M24 12v14"/><path d="M24 26v14"/><path d="M24 26l12 10"/>`),
  legpress: iconSvg(head(10,20) + `<path d="M10 24h16"/><path d="M26 24l8-8"/><path d="M34 16v22"/>`),
  legext: iconSvg(head(16,10) + `<path d="M16 14v16"/><path d="M16 30l18-4"/><circle cx="36" cy="27" r="2.5" fill="currentColor" stroke="none"/>`),
  legcurl: iconSvg(head(30,10) + `<path d="M30 14v16"/><path d="M30 30l-18 6"/><circle cx="10" cy="37" r="2.5" fill="currentColor" stroke="none"/>`),
  abduction: iconSvg(head(24,8) + `<path d="M24 12v14"/><path d="M24 26l-10 12"/><path d="M24 26l10 12"/><path d="M10 20l-4 4M38 20l4 4"/>`),
  chestpress: iconSvg(`<path d="M8 32h22"/><path d="M17 32V20"/><path d="M17 20l-9-8"/><path d="M17 20l9-8"/><path d="M6 24h6M28 24h6"/>`),
  row: iconSvg(head(14,12) + `<path d="M14 16l12 14"/><path d="M26 30l-10-4"/><path d="M26 30l10 4"/>`),
  pulldown: iconSvg(head(24,8) + `<path d="M10 12h28"/><path d="M24 12v10"/><path d="M24 22l-10 12"/><path d="M24 22l10 12"/>`),
  facepull: iconSvg(head(24,8) + `<path d="M24 12v18"/><path d="M24 18l-11-2"/><path d="M24 18l11-2"/><path d="M13 16l4 4M35 16l-4 4"/>`),
  lateral: iconSvg(head(24,8) + `<path d="M24 12v18"/><path d="M24 16l-16-3"/><path d="M24 16l16-3"/>`),
  reardelt: iconSvg(head(16,10) + `<path d="M16 14l14 16"/><path d="M22 20l-10-6"/><path d="M22 20l4-12"/>`),
  pecfly: iconSvg(`<path d="M6 32h24"/><path d="M18 32V22"/><path d="M18 22c-4-4-8-6-12-6"/><path d="M18 22c4-4 8-6 12-6"/>`),
  deadlift: iconSvg(head(24,8) + `<path d="M24 12l-8 14"/><path d="M16 26v14"/><path d="M24 12l-2 26"/><path d="M8 40h18"/>`),
  tricep: iconSvg(head(24,6) + `<path d="M24 10v10"/><path d="M24 10v22"/><path d="M24 20l-6 4"/>`),
  glutekick: iconSvg(`<path d="M8 22h16"/><path d="M8 22v14M16 22v14"/><path d="M24 22l12-10"/>`),
  adductor: iconSvg(head(24,8) + `<path d="M24 12v14"/><path d="M14 38l10-12"/><path d="M34 38l-10-12"/><path d="M11 32l3 4M37 32l-3 4"/>`),
  bicep: iconSvg(head(24,8) + `<path d="M24 12v14"/><path d="M24 26l-8 8"/><path d="M16 34l6-10"/>`)
};

function ytId(url){
  const m = url.match(/(?:v=|shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{6,15})/);
  return m ? m[1] : null;
}
function thumbHtml(ex){
  if(ex.photo){
    return `<img src="${encodeURI(ex.photo)}" alt="${ex.name}" loading="lazy">`;
  }
  const id = ytId(ex.video);
  if(id){
    return `<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="${ex.name}" loading="lazy">`;
  }
  return ICONX[ex.icon] || ICONX.squat;
}
function escapeAttr(value){
  return String(value || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Kg is stored with a "." decimal (so parseFloat elsewhere stays reliable) but shown with a
// "," — the convention a Spanish keyboard's decimal key actually types, and what <input type="number">
// silently rejects, which is why entering e.g. "27,5" used to read back wrong.
function fmtKg(v){ return String(v==null ? '' : v).replace('.', ','); }
function normKg(v){ return String(v==null ? '' : v).trim().replace(',', '.'); }

const DATA = {
  A: { label:"Día A", sub:"Tren inferior",
    warmup:[
      {name:"Cat-camel", series:"2", rep:"10", video:"https://www.youtube.com/watch?v=1cs3SKwQZpM"},
      {name:"Rotación torácica", series:"2", rep:"10", video:"https://www.youtube.com/watch?v=iWxGRsCGURM"},
      {name:"Elevación en Y", series:"2", rep:"10", video:"https://www.youtube.com/shorts/3pwh5M8nBSs"},
      {name:"Cadera 90/90", series:"2", rep:"10", video:"https://www.youtube.com/shorts/eu7CXsemhPk"}],
    strength:[
      {name:"Abducciones en máquina sentado", series:"3", rep:"14-18", recp:"1,5’", int:"8/10", muscle:"gluteo", icon:"abduction", video:"https://www.sergiomcoach.com/topics/10-abducciones-en-maquina-sentado-2/", photo:"fotos/abducciones en maquina sentado.png"},
      {name:"Sentadilla Multipower", series:"2", rep:"8-10", recp:"2’", int:"6/10", muscle:"cuadriceps", icon:"squat", video:"https://www.sergiomcoach.com/topics/1-sentadilla-en-multipower-2/", photo:"fotos/sentarilla multipower.png"},

  // ---------- Bloque 2 (from the trainer's "Bloque 2 Espe" sheet). Own day keys, so its
  // logs never share a day/index with Bloque 1's. No warm-up for now. ----------
  S1: { label:"Sesión 1", sub:"Torso",
    warmup:[],
    strength:[
      {name:"Remo en T", series:"3", rep:"8-12", recp:"2’", rir:"2", muscle:"espalda", icon:"row", video:"https://www.sergiomcoach.com/topics/33-remo-en-t-2/", photo:"fotos/remo t.png",
        tips:["Mantén buena técnica, evita despegar en exceso el pecho del apoyo.","No pegues un fuerte tirón inicial puesto que las fuerzas inerciales harán la parte más fácil de recorrido, realiza un movimiento controlado.","Controla la fase excéntrica, no dejes caer los brazos “muertos”.","En caso de énfasis en espalda alta, protráe y retráe las escápulas como movimiento principal, llevando los codos abiertos.","En caso de énfasis en dorsal lleva los codos hacia la cadera con un agarre neutro."]},
      {name:"Jalon al pecho neutro", series:"2", rep:"10-12", recp:"2’", rir:"1", muscle:"espalda", icon:"pulldown", video:"https://www.sergiomcoach.com/topics/6-jalon-al-pecho-neutro-2/", photo:"fotos/jalon neutro.png",
        tips:["Piensa en llevar los codos abajo y hacia atrás, no en flexionarlos.","No metas inercias, impulsos ni te tumbes para traccionar del agarre.","Saca pecho durante todo el ejercicio, evita “hundirlo”.","Puedes dejar, o no, que las escapulas se protraigan siempre que no pierdas tensión, pero esto implicará menos el dorsal y más otros grupos musculares."]},
      {name:"Press plano en máquina sentado", series:"3", rep:"8-12", recp:"2’", rir:"2", muscle:"pecho", icon:"chestpress", video:"https://www.sergiomcoach.com/topics/43-press-plano-sentado-en-maquina-plate-loaded-2/", note:"1º Serie a 8 repes",
        tips:["Puedes extender los codos completamente al ser convergente.","Piensa en juntar tus bíceps hacia tu pecho o línea media.","Evita rebotar con las palancas entre repeticiones para ayudarte.","Empuja con los pies hacia delante, clava y desciende tus hombros en el respaldo."]},
      {name:"Elevaciones laterales en máquina sentado", series:"3", rep:"12-16", recp:"1,5’", rir:"0", muscle:"hombro", icon:"lateral", video:"https://www.sergiomcoach.com/topics/6-elevaciones-laterales-en-maquina-sentado-2/",
        tips:["La fuerza y dirección del movimiento debe partir desde los codos.","Flexiona ligeramente el torso, cadera ligeramente hacia atrás.","No balancees tu cuerpo ni te impulses excesivamente.","No dobles el codo en exceso. Es mejor si únicamente está semiflexionado."]},
      {name:"Low Row énfasis espalda alta", series:"2", rep:"8-10", recp:"2’", rir:"1", muscle:"espalda", icon:"row", video:"https://www.sergiomcoach.com/topics/44-low-row-enfasis-espalda-alta-2/",
        tips:["Lleva tus codos hacia fuera y a los lados, no abajo y a la cadera.","Piensa que tienes un lápiz entre ambas escápulas y debes atraparlo con ellas.","Deja ir completamente las escápulas, elonga todo lo que puedas la musculatura escapular.","Mantén la cadera ligeramente más atrasada que los hombros."]},
      {name:"Pull Over desde polea alta con cuerda", series:"2", rep:"14-18", recp:"2’", rir:"0", muscle:"espalda", icon:"pulldown", video:"https://www.sergiomcoach.com/topics/19-pull-over-desde-polea-alta-con-cuerda-2/",
        tips:["Evita extender y flexionar los codos durante el ejercicio, déjalos fijos.","Céntrate en la dirección y extensión de tus hombros.","Piensa en aplastar tu dorsal ancho con tu tríceps."]},
      {name:"Pec Fly", series:"2", rep:"12-15", recp:"1,5’", rir:"0", muscle:"pecho", icon:"pecfly", video:"https://www.sergiomcoach.com/topics/22-aperturas-con-mancuerna-en-banco-plano-3/", photo:"fotos/pec fly.png",
        tips:["La articulación del codo permanece fija, un error común es flexionar el bíceps en la fase concéntrica y extenderlos quitando tensión al pectoral en la excéntrica.","Realiza el gesto de abrazo centrándote en la parte alta del brazo (bíceps).","Lleva los codos lo más atrás posible, ampliando el ROM activo lo máximo."]},
      {name:"Dead Bug", series:"3", rep:"10-14", recp:"1,5’", rir:"0", muscle:"core", icon:"squat", video:"https://youtu.be/qNiR-p1fmGo"}]
  },
  S2: { label:"Sesión 2", sub:"Pierna y brazo",
    warmup:[],
    strength:[
      {name:"Curl predicador en máquina", series:"3", rep:"8-12", recp:"1,5’", rir:"1", muscle:"biceps", icon:"bicep", video:"https://www.sergiomcoach.com/topics/9-curl-predicador-en-maquina-2/",
        tips:["Evita impulsarte con el torso o levantar el culo del asiento para subir la carga.","Intenta no despegar el codo del banco durante el movimiento.","Céntrate en flexionar el codo, controla las fases concéntrica y excéntrica y prueba a añadir una ligera contracción isométrica al final del movimiento.","Evita que en la fase excéntrica el codo se estire por completo, no es necesario."]},
      {name:"Extensiones de codo en polea V1", series:"3", rep:"10-14", recp:"1,5’", rir:"1", muscle:"triceps", icon:"tricep", video:"https://www.sergiomcoach.com/topics/16-extensiones-de-codo-en-polea-v1-2/",
        tips:["Busca aplastar tu antebrazo y tu bíceps, para después extenderlo.","El codo (tríceps) es únicamente quien debe realizar el movimiento, céntrate en doblarlo y extenderlo mientras sujetas la barra, no en alejarla de ti.","Evita movimientos bruscos o rápidos, controla las fases concéntrica y excéntrica.","Evita impulsos e inercias con el torso y los hombros, busca estabilidad."]},
      {name:"Abducciones en máquina de pie", series:"3", rep:"14-18", recp:"1,5’", rir:"0", muscle:"gluteo", icon:"abduction", video:"https://www.sergiomcoach.com/topics/26-abducciones-en-maquina-de-pie-sentado-2/",
        tips:["Empuja con las rodillas contra las almohadillas, no con los pies.","Piensa en separar tus rodillas de tu ombligo hacia los lados.","Tracciona con las manos para generar una posición estable.","Mantén los codos extendidos para evitar cargar tus bíceps en exceso.","Realiza un movimiento lento y controlado."]},
      {name:"Peso muerto Rumano RDL", series:"3", rep:"4-6", recp:"3’", rir:"3", muscle:"isquios", icon:"deadlift", video:"https://www.sergiomcoach.com/topics/1-peso-muerto-rumano-rdl-2/", photo:"fotos/peso muerto rumano.png",
        tips:["Piensa en “llevar la cadera hacia atrás y arriba” y la barra descenderá sola.","No pienses en “bajar la barra”, según tu anatomía la profundidad será mayor o menor. Para una vez que el movimiento deja de producirse desde la cadera.","Mantén la barra constantemente rozando tus tibias y muslos en ambas fases.","Mantén la espalda compacta, neutra y apretada: piensa que tienes una moneda en las axilas y no debes dejar que caiga. Realiza depresión escapular.","La espalda alta puede “redondearse” en la parte alta del movimiento, para mantener hombros en la línea perpendicular que forma el suelo con tu cadera."]},
      {name:"Sentadilla búlgara con mancuerna + apoyo de mano", series:"2", rep:"8-12", recp:"2’", rir:"2", muscle:"cuadriceps", icon:"splitsquat", video:"https://www.sergiomcoach.com/topics/8-sentadilla-bulgara-con-mancuerna-apoyo-de-mano-2/", photo:"fotos/sentadilla bulgara.png",
        tips:["Utiliza straps para que el agarre de la mancuerna no te limite y poder cargar más peso. Coloca la mancuerna en el lado, generalmente.","Trata de mantener el torso vertical y perpendicular al suelo.","Aplica fuerza hacia delante y hacia abajo con el pie para subir.","Busca la máxima flexión de rodilla, adelanta la rodilla todo lo que puedas respecto a la punta del pie. Puedes utilizar un tacón."]},
      {name:"Prensa 45º", series:"2", rep:"10-14", recp:"2’", rir:"2", muscle:"cuadriceps", icon:"legpress", video:"https://www.sergiomcoach.com/topics/5-prensa-45o-2/",
        tips:["Coloca los pies abajo y con una anchura cómoda que permita maximizar el ROM (aprox. anchura hombros) y con los pies neutros, sin rotar hacia ningún lado.","Realiza el máximo rango de recorrido posible, valorando la flexión de rodilla. Piensa en aplastar tus gemelos con tus isquios. No recortes ROM para subir peso.","Evita que se te despeguen los talones de la plataforma y que tus rodillas colapsen hacia adentro.","Evita rebotes o inercias que te ayuden en la fase concéntrica."]},
      {name:"Leg curl sentado", series:"2", rep:"12-15", recp:"1,5’", rir:"0", muscle:"isquios", icon:"legcurl", video:"https://www.sergiomcoach.com/topics/6-leg-curl-sentado-2/", photo:"fotos/curl femoral sentado.png",
        tips:["Empuja fuertemente las manetas y aplica fuerza con tu torso y cadera contra el respaldo, para que no se extienda y permanecer anclado con la cadera en flexión.","Piensa en llevar tus gemelos a tocar tus isquiosurales.","Realiza una excéntrica controlada, evita dejar que la almohadilla se vaya rápido y busca sentir bien el estiramiento sobre los isquios.","Mantener los tobillos en flexión activa puede ayudar generando mayor estabilidad sobre la rodilla. También evitará que se te carguen los gemelos."]},
      {name:"Leg Extensions", series:"3", rep:"10-14", recp:"1,5’", rir:"0", muscle:"cuadriceps", icon:"legext", video:"https://www.sergiomcoach.com/topics/9-leg-extensions-2/", photo:"fotos/extensiones .png",
        tips:["No tengas prisa, aguanta la fase excéntrica y contrae fuerte en la concéntrica. Prueba a añadir una ligera pausa en la parte de arriba antes de descender.","Agárrate fuerte a las manetas para evitar desplazarte y poder aplicar más fuerza.","Fija tu cadera al banco, evita levantar el glúteo o despegarla."]}]
  },
  S3: { label:"Sesión 3", sub:"Torso",
    warmup:[],
    strength:[
      {name:"Press plano con mancuernas", series:"3", rep:"6-8", recp:"2’", rir:"2", muscle:"pecho", icon:"chestpress", video:"https://www.sergiomcoach.com/topics/3-press-plano-con-mancuernas-2/", photo:"fotos/press plano con mancuernas.png",
        tips:["Céntrate en la trayectoria del húmero al empujar hacia arriba, no en juntar las mancuernas.","No hagas un excesivo arco lumbar.","No despegues el culo del banco.","No cierres excesivamente los codos, busca una posición cómoda entre 60-90º."]},
      {name:"Press inclinado en máquina sentado", series:"2", rep:"8-10", recp:"2’", rir:"2", muscle:"pecho", icon:"chestpress", video:"https://www.sergiomcoach.com/topics/41-press-inclinado-sentado-2/",
        tips:["Adelanta el glúteo respecto al asiento para mejor alineación del movimiento con el pectoral, no lo dejes pegado atrás.","Puede ser interesante empezar cada repetición con un empuje muy fuerte en caso de que sea muy difícil la parte final del movimiento.","Evita perder tensión en cada repetición, no choques con los soportes.","No escojas un agarre ni demasiado amplio ni demasiado estrecho."]},
      {name:"Curl tumbado en banco inclinado", series:"3", rep:"12-15", recp:"1,5’", rir:"0", muscle:"biceps", icon:"bicep", video:"https://www.sergiomcoach.com/topics/6-curl-tumbado-en-banco-inclinado-2/", photo:"fotos/curl de biceps.png",
        tips:["Céntrate en el movimiento de flexión del codo, no muevas el hombro.","Evita balancear los brazos para aprovechar el impulso, no debe ser un péndulo.","El bíceps debe quedar prácticamente vertical una vez te sientes.","Utiliza preferentemente un agarre supino, aunque puedes partir desde neutro."]},
      {name:"Remo gironda", series:"3", rep:"8-10", recp:"2’", rir:"2", muscle:"espalda", icon:"row", video:"https://www.sergiomcoach.com/topics/11-remo-gironda-2/", photo:"fotos/remo gironda prono.png",
        tips:["Evita tirar el cuerpo hacia atrás para impulsarte y mover el cable, no importa “tirar” el agarre hacia atrás si no mover tus codos.","Piensa en llevar tus codos hacia la cadera e incluso puedes añadir ligera intención en “juntarlos” por detrás.","No es necesario que el codo pase la línea de tu torso en la fase concéntrica, ni que las escapulas se protraigan durante la fase excéntrica."]},
      {name:"Remo con mancuerna unilateral", series:"3", rep:"8-10", recp:"2’", rir:"2", muscle:"espalda", icon:"row", video:"https://www.sergiomcoach.com/topics/20-remo-con-mancuerna-unilateral-2/", photo:"fotos/remo con mancuerna.png",
        tips:["Piensa en llevar tu codo a la cadera.","Realiza una trayectoria ligeramente angular, evita excesiva flexión de codo.","No “tires” de golpe ni te impulses con el cuerpo como arrancando un cortacésped, imagina que la mancuerna es un “serrucho”.","Busca elongar el dorsal alejando la mancuerna de ti en la fase excéntrica."]},
      {name:"Press francés con mancuernas tumbado", series:"2", rep:"10-12", recp:"1,5’", rir:"1", muscle:"triceps", icon:"tricep", video:"https://www.sergiomcoach.com/topics/3-press-frances-con-mancuernas-tumbado-2/",
        tips:["Busca aplastar tu bíceps contra tu antebrazo en cada repetición.","No es necesario bloquear del todo los codos, puedes mantener la tensión.","Controla la alineación de tus codos, que no se abran en exceso."]},
      {name:"Pec Fly", series:"2", rep:"12-16", recp:"1,5’", rir:"1", muscle:"pecho", icon:"pecfly", video:"https://www.sergiomcoach.com/topics/22-aperturas-con-mancuerna-en-banco-plano-3/", photo:"fotos/pec fly.png",
        tips:["La articulación del codo permanece fija, un error común es flexionar el bíceps en la fase concéntrica y extenderlos quitando tensión al pectoral en la excéntrica.","Realiza el gesto de abrazo centrándote en la parte alta del brazo (bíceps).","Lleva los codos lo más atrás posible, ampliando el ROM activo lo máximo."]},
      {name:"Extensiones de codo en polea trasnuca con cuerda", series:"3", rep:"10-12", recp:"1,5’", rir:"0", muscle:"triceps", icon:"tricep", video:"https://www.sergiomcoach.com/topics/2-extensiones-de-codo-en-polea-trasnuca-con-cuerda-en-2/", photo:"fotos/extensiones trasnuca.png",
        tips:["Intenta tocar antebrazo y bíceps en cada repetición. El ROM debe ser completo.","Evita ayudarte con impulsos y/o con los hombros para realizar la fase concéntrica, piensa únicamente en extender tus codos.","Evita centrarte en separar las cuerdas, ya que será un movimiento ineficiente que parte de la muñeca. Céntrate en extender el codo subiéndolas verticalmente."]}]
  },
  S4: { label:"Sesión 4", sub:"Pierna",

// Local date (Spain), not UTC: toISOString() would give yesterday's date between
// midnight and 1–2am.
function todayStr(){ return dateKey(new Date()); }

// Supabase is the only place data lives — no local-storage fallback. If a read or
// write fails, syncError holds a message the UI shows until the next call succeeds,
// so a failed save is always visible instead of silently vanishing.
let syncError = null;
const NO_DB_MSG = 'No hay conexión con la base de datos: no se puede leer ni guardar nada ahora mismo.';

function emptyLog(){ return { weights:{}, cardio:{ minutes:"", machine:"" }, done:{}, sets:{}, notes:{}, custom:[] }; }

async function getLog(day, date){
  if(!sb){ syncError = NO_DB_MSG; return emptyLog(); }
  try{
    const { data, error } = await sb.from('workout_logs').select('weights,cardio,done,sets,notes,custom').eq('day', day).eq('log_date', date).maybeSingle();
    if(error) throw error;
    syncError = null;
    if(!data) return emptyLog();
    return { weights: data.weights||{}, cardio: data.cardio||{minutes:"",machine:""}, done: data.done||{}, sets: data.sets||{}, notes: data.notes||{}, custom: data.custom||[] };
  }catch(e){
    syncError = 'No se pudo cargar tu progreso de hoy: revisa la conexión y recarga la página.';
    return emptyLog();
  }
}

async function saveLog(day, date, logObj){
  if(!sb){ syncError = NO_DB_MSG; return; }
  try{
    const { error } = await sb.from('workout_logs').upsert(
      { day, log_date: date, weights: logObj.weights, cardio: logObj.cardio, done: logObj.done, sets: logObj.sets||{}, notes: logObj.notes||{}, custom: logObj.custom||[], updated_at: new Date().toISOString() },
      { onConflict: 'day,log_date' }
    );
    if(error) throw error;
    syncError = null;
  }catch(e){
    syncError = 'No se pudo guardar este cambio: revisa tu conexión e inténtalo de nuevo.';
  }
}

async function deleteLog(day, date){
  if(!sb){ syncError = NO_DB_MSG; return; }
  try{
    const { error } = await sb.from('workout_logs').delete().eq('day', day).eq('log_date', date);
    if(error) throw error;
    syncError = null;
  }catch(e){
    syncError = 'No se pudo borrar la sesión anterior: revisa tu conexión e inténtalo de nuevo.';
  }
}

async function listAllLogs(){
  if(!sb){ syncError = NO_DB_MSG; return []; }
  try{
    const { data, error } = await sb.from('workout_logs').select('day,log_date,weights,cardio,done,sets,notes,custom').order('log_date',{ascending:false});
    if(error) throw error;
    syncError = null;
    return (data||[]).map(r => ({ day: r.day, date: r.log_date, weights: r.weights||{}, cardio: r.cardio||{}, done: r.done||{}, sets: r.sets||{}, notes: r.notes||{}, custom: r.custom||[] }));
  }catch(e){
    syncError = 'No se pudo cargar el historial: revisa tu conexión.';
    return [];
  }
}

// The trainer screen works on the most recent trainer session; older ones stay saved
// so Historial/Informes keep showing them. Its date is the last day an exercise was
// added to it (or the day it was created), which is also what Historial/Informes show.
async function getEntrenadorSession(){
  const entries = (await listAllLogs()).filter(e => e.day === 'ENTRENADOR');
  return entries[0] || null;
}

// Returns false (and changes nothing) when there's already a session today: whatever
// is added next goes into that same session instead of wiping it.
async function startNewEntrenadorSession(){
  const session = await getEntrenadorSession();
  if(session && session.date === todayStr()) return false;
  await saveLog('ENTRENADOR', todayStr(), emptyLog());
  return true;
}

async function getRecentSessions(day, excludeDate, limit=3){
  const logs = (await listAllLogs())
    .filter(l => l.day === day && l.date !== excludeDate)
    .sort((a,b) => b.date.localeCompare(a.date));
  const result = {};
  DATA[day].strength.forEach((ex, idx)=>{
    const sessions = [];
    for(const l of logs){
      if(sessions.length >= limit) break;
      const arr = (l.sets && l.sets[idx]) || [];
      const valid = arr.filter(s => s && (s.kg || s.reps));
      if(valid.length){
        sessions.push({ date: l.date, sets: valid.map(s => ({ kg: s.kg, reps: s.reps })) });
      }
    }
    result[idx] = sessions;
  });
  return result;
}

function pendingFirst(list, prefix, doneMap){
  return list.map((_,i)=>i).sort((a,b)=>{
    const da = !!doneMap[`${prefix}-${a}`];
    const db = !!doneMap[`${prefix}-${b}`];
    if(da === db) return a-b;
    return da ? 1 : -1;
  });
}

function addExerciseFormHtml(idPrefix){
  const catalog = exerciseCatalog();
  const datalistOptions = [...catalog.keys()].map(n=>`<option value="${escapeAttr(n)}">`).join('');
  const muscleOptions = Object.entries(MUSCLES).map(([k,label])=>`<option value="${k}">${label}</option>`).join('');
  return `
    <div class="card" id="${idPrefix}-form">
      <input class="note-input" type="text" id="${idPrefix}-name" placeholder="Nombre del ejercicio" list="${idPrefix}-catalog" autocomplete="off">
      <datalist id="${idPrefix}-catalog">${datalistOptions}</datalist>
      <div class="cardio-row" style="margin-top:9px;">
        <div class="cardio-field">
          <label>Grupo muscular</label>
          <select class="kg-input" id="${idPrefix}-muscle">${muscleOptions}</select>
        </div>
      </div>
      <div id="${idPrefix}-muscle-list" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:9px;"></div>
      <div class="sets-grid" id="${idPrefix}-sets" style="margin-top:9px;"></div>
      <button class="video-btn" type="button" id="${idPrefix}-add-set" style="border-style:dashed;">+ Añadir serie</button>
      <button class="video-btn" type="button" id="${idPrefix}-save">Guardar ejercicio</button>
      <div class="storage-note sync-error" id="${idPrefix}-msg" style="display:none;"></div>

  `;
}

// What's typed in an "Añadir ejercicio" form but not saved yet, so a re-render of the
// screen (ticking an exercise as done, Calcular…) doesn't wipe it.
const addFormDrafts = {};

function wireAddExerciseForm(idPrefix, onSave, draftKey = idPrefix){
  const catalog = exerciseCatalog();
  const byMuscle = new Map();
  catalog.forEach((muscle, name)=>{
    if(!byMuscle.has(muscle)) byMuscle.set(muscle, []);
    byMuscle.get(muscle).push(name);
  });
  const nameEl = document.getElementById(`${idPrefix}-name`);
  const muscleEl = document.getElementById(`${idPrefix}-muscle`);
  const muscleListEl = document.getElementById(`${idPrefix}-muscle-list`);
  const setsEl = document.getElementById(`${idPrefix}-sets`);
  const msgEl = document.getElementById(`${idPrefix}-msg`);
  const draft = addFormDrafts[draftKey];
  let setRows = draft ? draft.setRows : [{ kg:'', reps:'' }];
  if(draft){
    nameEl.value = draft.name;
    muscleEl.value = draft.muscle;
    muscleEl.disabled = draft.muscleLocked;
  }

  function saveDraft(){
    addFormDrafts[draftKey] = { name: nameEl.value, muscle: muscleEl.value, muscleLocked: muscleEl.disabled, setRows };
  }
  function showMsg(text){
    msgEl.textContent = text;
    msgEl.style.display = text ? '' : 'none';
  }

  function renderMuscleList(){
    const names = byMuscle.get(muscleEl.value) || [];
    muscleListEl.innerHTML = names.map(n => `<button type="button" class="tab" style="width:auto;" data-name="${escapeAttr(n)}">${escapeAttr(n)}</button>`).join('');
    muscleListEl.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        nameEl.value = btn.dataset.name;
        muscleEl.value = catalog.get(btn.dataset.name);
        muscleEl.disabled = true;
        showMsg('');
        saveDraft();
      });
    });
  }
  // A name typed by hand hides the shortcut buttons, so a stray tap can't silently replace it.
  function syncMuscleListVisibility(){
    muscleListEl.style.display = nameEl.value.trim() ? 'none' : 'flex';
  }
  renderMuscleList();
  syncMuscleListVisibility();
  muscleEl.addEventListener('change', ()=>{ renderMuscleList(); saveDraft(); });

  function renderSetRows(){
    setsEl.innerHTML = setRows.map((s,i) => `
      <div class="set-row">
        <span class="set-label">Serie ${i+1}</span>
        <input type="text" inputmode="decimal" placeholder="0" value="${fmtKg(s.kg)}" data-i="${i}" data-field="kg">
        <span class="unit">kg</span>
        <span class="sep">×</span>
        <input type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="${s.reps}" data-i="${i}" data-field="reps">
        <span class="unit">reps</span>
      </div>
    `).join('');
    // Updated on every keystroke, not on leaving the box: tapping "Guardar" straight after
    // typing the last number must still count it.
    setsEl.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const i = Number(inp.dataset.i);
        const field = inp.dataset.field;
        setRows[i][field] = field==='kg' ? normKg(inp.value) : inp.value;
        showMsg('');
        saveDraft();
      });
    });
  }
  renderSetRows();

  nameEl.addEventListener('input', ()=>{
    const match = [...catalog.keys()].find(n => n.toLowerCase() === nameEl.value.trim().toLowerCase());
    if(match){ muscleEl.value = catalog.get(match); muscleEl.disabled = true; }
    else{ muscleEl.disabled = false; }
    syncMuscleListVisibility();
    showMsg('');
    saveDraft();
  });

  document.getElementById(`${idPrefix}-add-set`).addEventListener('click', ()=>{
    setRows.push({ kg:'', reps:'' });
    renderSetRows();
    saveDraft();
  });

  document.getElementById(`${idPrefix}-save`).addEventListener('click', ()=>{
    const name = nameEl.value.trim();
    if(!name){ showMsg('Escribe el nombre del ejercicio.'); return; }
    const sets = setRows.filter(s=>s.kg || s.reps);
    if(!sets.length){ showMsg('Apunta al menos una serie.'); return; }
    showMsg('');
    delete addFormDrafts[draftKey];
    onSave({ name, muscle: muscleEl.value, sets });
    nameEl.value = '';
    muscleEl.disabled = false;
    syncMuscleListVisibility();
    setRows = [{ kg:'', reps:'' }];
    renderSetRows();
  });
}

// Cache of the last computed plan's substituted day, read synchronously by renderTabs()
// so the "Esta semana" menu can show the right 3 days without becoming async itself.
let cachedSubstitutedDay = null;

// The calculated plan is saved inside the trainer session's own row (in its otherwise
// unused "notes" field), so it's calculated once and reused until a new session starts.
function planSig(custom){ return (custom||[]).map(e=>e.name.trim().toLowerCase()).join('|'); }

// A plan calculated while an older block was current points at that block's days, so
// it doesn't apply any more: treated as not calculated until Calcular is pressed again.
function currentBlockPlan(session){
  const plan = session && session.notes && session.notes.plan;
  if(!plan || !plan.list.every(r => DAY_ORDER.includes(r.day))) return null;
  return plan;
}

async function getActiveWeekPlan(){
  const session = await getEntrenadorSession();
  const plan = currentBlockPlan(session);
  if(!plan){ cachedSubstitutedDay = null; return null; }
  cachedSubstitutedDay = plan.substitutedDay;
  return plan.list;
}

const NOT_SAME_DAY = [
  ['press plano con mancuernas (pies en banco)', 'press inclinado con mancuernas', 'pec fly']
];

// Two names count as the same exercise when they only differ in case, accents,
// punctuation or little words ("Sentadilla Multipower" = "Sentadilla en multipower").
const NAME_FILLER_WORDS = new Set(['en','de','del','con','al','a','el','la','los','las','y']);
// Different names for the same exercise (e.g. English vs Spanish), on the cleaned-up name.
const SAME_EXERCISE = [
  { pattern: /\b(leg extensions?|extension(es)? cuadriceps)\b/, key: 'leg extension' }
];
function matchName(name){
  const clean = String(name||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9ºª]+/g,' ').trim().split(' ')
    .filter(w => w && !NAME_FILLER_WORDS.has(w)).join(' ');
  const alias = SAME_EXERCISE.find(a => a.pattern.test(clean));
  return alias ? alias.key : clean;
}

function computeWeekPlan(trainerCustom){
  const pool = [];
  DAY_ORDER.forEach(day=>{
    DATA[day].strength.forEach((ex,idx)=>{ pool.push({ day, idx, name:ex.name, muscle:ex.muscle, series: parseInt(ex.series,10)||1 }); });
  });
  // Count how many times the trainer did each exact exercise, so only that many
  // occurrences get removed from the pool — an exercise done once by the trainer
  // but planned twice this week (e.g. in both Día A and Día C) only loses one of
  // those two, keeping as much of the planned volume as possible.
  const remaining = {};
  trainerCustom.forEach(e=>{
    const key = matchName(e.name);
    remaining[key] = (remaining[key]||0) + 1;
  });

  const results = pool.map(ex=>{
    const key = matchName(ex.name);
    if(remaining[key] > 0){
      remaining[key]--;
      return { ...ex, status:'mismo' };
    }
    return { ...ex, status:'queda' };
  });

  // The "día sustituido" is whichever day has the most exact matches with the
  // trainer's session — no need to mark it, it falls out of what was logged.
  const removalsByDay = {};
  DAY_ORDER.forEach(d=>{ removalsByDay[d] = 0; });
  results.filter(r=>r.status==='mismo').forEach(r=>{ removalsByDay[r.day]++; });
  // The week has only 3 days of your own, so one day's exercises get spread over the
  // other 3 (none is lost): the day with most exercises already done with the trainer.
  // On a tie — or when nothing matches by name — the day whose muscle groups overlap
  // most with the trainer's session.
  const trainerSeries = {};
  trainerCustom.forEach(e=>{ trainerSeries[e.muscle] = (trainerSeries[e.muscle]||0) + Math.max((e.sets||[]).length, 1); });
  const overlap = d => {
    const daySeries = {};
    pool.filter(p=>p.day===d).forEach(p=>{ daySeries[p.muscle] = (daySeries[p.muscle]||0) + p.series; });
    return Object.entries(trainerSeries).reduce((sum,[m,n])=> sum + Math.min(n, daySeries[m]||0), 0);
  };
  const better = (d, best) => removalsByDay[d] !== removalsByDay[best]
    ? removalsByDay[d] > removalsByDay[best]
    : overlap(d) > overlap(best);
  const substitutedDay = DAY_ORDER.reduce((best,d)=> better(d, best) ? d : best, DAY_ORDER[0]);
  const otherDays = DAY_ORDER.filter(d=>d!==substitutedDay);

  // The 3 other days stay exactly as they are — their survivors just keep their own day.
  results.filter(r=>r.status==='queda' && r.day!==substitutedDay).forEach(r=>{ r.assignedTo = r.day; });

  // The substituted day's survivors get spread across the other 3. The day with
  // the LEAST total work so far (its own catalog plus whatever's already landed
  // on it from this redistribution) wins first — that's what keeps any one day
  // from ending up with way more exercises than the other two. Only when two
  // days are tied on total load do we break the tie by which has less of that
  // specific muscle group, to avoid stacking the same muscle unnecessarily.
  const totalLoad = {};
  otherDays.forEach(d=>{
    totalLoad[d] = results
      .filter(r=>r.status==='queda' && r.assignedTo===d)
      .reduce((sum,r)=>sum+r.series, 0);
  });

  const orphans = results.filter(r=>r.status==='queda' && r.day===substitutedDay);
  const byMuscle = {};
  orphans.forEach(ex=>{ (byMuscle[ex.muscle] = byMuscle[ex.muscle]||[]).push(ex); });
  Object.entries(byMuscle).forEach(([muscle, list])=>{
    const muscleLoad = {};
    otherDays.forEach(d=>{
      muscleLoad[d] = results
        .filter(r=>r.status==='queda' && r.assignedTo===d && r.muscle===muscle)
        .reduce((sum,r)=>sum+r.series, 0);
    });
    list.forEach(ex=>{
      // Moved exercises never land on a day that already has one of the others in
      // their "not together" group (falls back to any day only if every day clashes).
      const group = NOT_SAME_DAY.find(g => g.includes(ex.name.trim().toLowerCase()));
      const clashFree = group
        ? otherDays.filter(d => !results.some(r => r!==ex && r.status==='queda' && r.assignedTo===d && group.includes(r.name.trim().toLowerCase())))
        : otherDays;
      const candidates = clashFree.length ? clashFree : otherDays;
      const target = candidates.reduce((best,d)=>{
        if(totalLoad[d] !== totalLoad[best]) return totalLoad[d] < totalLoad[best] ? d : best;
        return muscleLoad[d] < muscleLoad[best] ? d : best;
      }, candidates[0]);
      ex.assignedTo = target;
      totalLoad[target] += ex.series;
      muscleLoad[target] += ex.series;
    });
  });

  return { list: results, substitutedDay };
}

function dayLabelMap(substitutedDay){
  const keptDays = DAY_ORDER.filter(d=>d!==substitutedDay).slice(0,3);
  const map = new Map(keptDays.map((d,i)=>[d, `Día ${i+1}`]));
  return map;
}

const PLAN_REMOVED = 'QUITAR';

// Per-day totals of the plan as it stands (dropdown changes included, before saving):
// exercises and series, then series per muscle group.
function weekPlanSumHtml(list, labels){
  return [...labels.entries()].map(([d,label])=>{
    const onDay = list.filter(r => r.status === 'queda' && r.assignedTo === d);
    const series = onDay.reduce((sum,r)=>sum+r.series, 0);
    const byMuscle = {};
    onDay.forEach(r=>{ byMuscle[r.muscle] = (byMuscle[r.muscle]||0) + r.series; });
    const muscles = Object.entries(byMuscle)
      .sort((a,b)=>b[1]-a[1])
      .map(([m,n])=>`${MUSCLES[m]||m} ${n}`).join(' · ');
    return `<div class="prev-history"><b>${label}:</b> ${onDay.length} ejercicios · ${series} series<br>${muscles}</div>`;
  }).join('');
}

function weekPlanRowHtml(ex, labels, i){
  // The spread-out session isn't one of this week's 3 labeled days: name it by its own session.
  const origin = labels.get(ex.day) || `${DATA[ex.day].label} · ${DATA[ex.day].sub}`;
  let right;
  if(ex.status === 'mismo'){
    right = `<span class="v" style="color:var(--ink-dim);">Se quita — mismo ejercicio que el entrenador</span>`;
  } else {
    // "Quitar" takes it out of this week; it isn't shown on any day (picking a day brings it back).
    const removed = ex.assignedTo === PLAN_REMOVED;
    const color = removed ? 'var(--ink-dim)' : ex.assignedTo === ex.day ? 'var(--volt)' : 'var(--teal)';
    const opts = [...labels.entries()].map(([d,label])=>`<option value="${d}" ${d===ex.assignedTo?'selected':''}>${label}</option>`).join('')
      + `<option value="${PLAN_REMOVED}" ${removed?'selected':''}>Quitar</option>`;
    right = `<select class="kg-input plan-dest" data-i="${i}" aria-label="Día de ${escapeAttr(ex.name)}" style="width:auto; flex:0 0 auto; color:${color};">${opts}</select>`;
  }
  return `
    <div class="hist-item-block">
      <div class="hist-item" style="align-items:center;">
        <span class="n">${escapeAttr(ex.name)} <span style="color:var(--ink-dim); font-weight:500;">· ${MUSCLES[ex.muscle]||ex.muscle} · ${origin}</span></span>
        ${right}
      </div>
    </div>
  `;
}

async function renderEntrenador(token){
  const session = await getEntrenadorSession();
  const date = session ? session.date : todayStr();
  const log = session || emptyLog();
  if(token !== renderToken) return;

  // The same exercise added more than once (by name, ignoring case) is one row with all its sets.
  const grouped = new Map();
  (log.custom||[]).forEach(ex => {
    const key = ex.name.trim().toLowerCase();
    if(!grouped.has(key)) grouped.set(key, { name: ex.name.trim(), muscle: ex.muscle, sets: [] });
    grouped.get(key).sets.push(...(ex.sets||[]));
  });
  const rows = [...grouped.values()].map(ex => `
    <div class="hist-item-block">
      <div class="hist-item">
        <span class="n">${escapeAttr(ex.name)} <span style="color:var(--ink-dim); font-weight:500;">· ${MUSCLES[ex.muscle]||ex.muscle}</span></span>
        <span class="v">${fmtSets(ex.sets)}</span>
      </div>
    </div>
  `).join('');

  const canCalc = (log.custom||[]).length > 0;

  mainEl.innerHTML = `
    <div class="day-head"><h2>Entrenador</h2><span class="progress">${date}</span></div>
    ${syncError ? `<div class="storage-note sync-error">${syncError}</div>` : ''}
    <button class="video-btn" type="button" id="btn-nueva-sesion" style="border-style:dashed;">Nueva sesión</button>
    <div class="prev-history" id="nueva-sesion-msg" style="display:none;">Ya tienes una sesión hoy: lo que añadas se suma a ella.</div>
    <div class="card">
      ${rows || '<div class="prev-history">Aún no has añadido nada en esta sesión.</div>'}
    </div>
    ${addExerciseFormHtml('entrenador')}
    <div class="section-label strength">Calcular</div>
    <div class="card">
      ${canCalc ? '' : '<div class="prev-history">Añade al menos un ejercicio del entrenador para poder calcular.</div>'}
      <button class="video-btn" type="button" id="btn-calcular" ${canCalc?'':'disabled style="opacity:.5;"'}>Calcular</button>
      <div id="plan-resultado"></div>
    </div>
  `;

  document.getElementById('btn-nueva-sesion').addEventListener('click', async ()=>{
    if(!(await startNewEntrenadorSession())){
      document.getElementById('nueva-sesion-msg').style.display = '';
      return;
    }
    cachedSubstitutedDay = null;
    await renderMain();
  });

  wireAddExerciseForm('entrenador', async (entry)=>{
    const fresh = await getLog('ENTRENADOR', date);
    fresh.custom = fresh.custom || [];
    fresh.custom.push(entry);
    // The session takes the date of the day exercises are actually added, so a
    // session started on one day and trained on another shows the real day.
    const today = todayStr();
    await saveLog('ENTRENADOR', today, fresh);
    if(date !== today && !syncError) await deleteLog('ENTRENADOR', date);
    await renderMain();
  });

  const resultEl = document.getElementById('plan-resultado');
  const savedPlan = currentBlockPlan(log);
  if(savedPlan){
    cachedSubstitutedDay = savedPlan.substitutedDay;
    const labels = dayLabelMap(savedPlan.substitutedDay);
    const stale = savedPlan.sig !== planSig(log.custom);
    resultEl.innerHTML = (stale ? '<div class="prev-history">Has añadido ejercicios después de calcular: pulsa Calcular otra vez para actualizar el reparto.</div>' : '')
      + '<div id="plan-suma"></div>'
      + savedPlan.list.map((ex,i)=>weekPlanRowHtml(ex, labels, i)).join('')
      + '<button class="video-btn" type="button" id="btn-guardar-plan">Guardar cambios</button>';

    const edited = savedPlan.list.map(ex=>({ ...ex }));
    const sumaEl = document.getElementById('plan-suma');
    sumaEl.innerHTML = weekPlanSumHtml(edited, labels);
    resultEl.querySelectorAll('.plan-dest').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        edited[Number(sel.dataset.i)].assignedTo = sel.value;
        sumaEl.innerHTML = weekPlanSumHtml(edited, labels);
      });
    });
    document.getElementById('btn-guardar-plan').addEventListener('click', async ()=>{
      const fresh = await getLog('ENTRENADOR', date);
      fresh.notes = fresh.notes || {};
      fresh.notes.plan = { ...fresh.notes.plan, list: edited };
      await saveLog('ENTRENADOR', date, fresh);
      await renderMain();
    });
  }

  if(canCalc){
    document.getElementById('btn-calcular').addEventListener('click', async ()=>{
      const { list, substitutedDay } = computeWeekPlan(log.custom);
      const fresh = await getLog('ENTRENADOR', date);
      fresh.notes = fresh.notes || {};
      fresh.notes.plan = { substitutedDay, list, sig: planSig(fresh.custom) };
      await saveLog('ENTRENADOR', date, fresh);
      await renderMain();
      renderTabs();
    });
  }
}

async function renderMain(){
  const token = ++renderToken;
  if(current === 'HIST'){ await renderHistory(token); return; }
  if(current === 'INFORMES'){ await renderInformes(token); return; }
  if(current === 'ENTRENADOR'){ await renderEntrenador(token); return; }
  if(mode === 'BLOQUE1'){ await renderBlock1Day(token); return; }

  const day = current;
  const d = DATA[day];
  const date = todayStr();
  const log = await getLog(day, date);
  const doneMap = log.done || {};

  // In "Esta semana" mode, if there's trainer data logged this week, show this day's
  // share of the recalculated plan — some exercises native to it, some moved in from
  // the substituted day — instead of its default list. Calculating it is pointless if
  // you don't actually see it when you come to train.
  const weekPlan = mode === 'SEMANA' ? await getActiveWeekPlan() : null;
  if(token !== renderToken) return; // a newer render started while we were waiting on these

  let strengthEntries = d.strength.map((ex,idx)=>({ ex, originDay: day, originIdx: idx }));
  const logCache = new Map([[day, log]]);
  if(weekPlan){
    strengthEntries = weekPlan
      .filter(r => r.status === 'queda' && r.assignedTo === day)
      .map(r => ({ ex: DATA[r.day].strength[r.idx], originDay: r.day, originIdx: r.idx }));
    const otherDays = [...new Set(strengthEntries.map(e=>e.originDay).filter(d2=>d2!==day))];
    for(const d2 of otherDays){ logCache.set(d2, await getLog(d2, date)); }
    if(token !== renderToken) return;
  }

  // "Antes" (recent sessions) must come from each exercise's own origin day, not the
  // day it's being displayed on — otherwise a moved-in exercise shows another
  // exercise's history by coincidence of sharing a number.
  const originDaysPresent = [...new Set(strengthEntries.map(e=>e.originDay))];
  const recentSessionsByDay = new Map();
  for(const d2 of originDaysPresent){ recentSessionsByDay.set(d2, await getRecentSessions(d2, date)); }
  if(token !== renderToken) return;
  async function cachedLog(d2){
    if(!logCache.has(d2)) logCache.set(d2, await getLog(d2, date));
    return logCache.get(d2);
  }

  // Done exercises sink to the bottom, pending ones keep their order.
  const isEntryDone = ({originDay, originIdx}) => !!((logCache.get(originDay)||{}).done||{})[`strength-${originIdx}`];
  strengthEntries = [...strengthEntries.filter(e=>!isEntryDone(e)), ...strengthEntries.filter(isEntryDone)];

  const total = d.warmup.length + strengthEntries.length;
  const doneCount = [...d.warmup.keys()].filter(i=>doneMap[`warm-${i}`]).length
                  + strengthEntries.filter(({originDay, originIdx}) => (logCache.get(originDay).done||{})[`strength-${originIdx}`]).length;

  const strengthCardHtml = ({ex, originDay, originIdx})=>{
    const oLog = logCache.get(originDay);
    return strengthCard(originDay, ex, originIdx, oLog.sets[originIdx]||[], oLog.notes[originIdx]||'', oLog.done||{}, recentSessionsByDay.get(originDay)[originIdx]);
  };
  const warmIdx = d.warmup.map((_,i)=>i);
  const pendingWarmIdx = warmIdx.filter(i=>!doneMap[`warm-${i}`]);
  const doneWarmIdx = warmIdx.filter(i=>doneMap[`warm-${i}`]);
  // Order below the strength heading: pending strength, then done warm-ups, then done strength.
  const strengthCardsHtml = strengthEntries.filter(e=>!isEntryDone(e)).map(strengthCardHtml).join('')
    + doneWarmIdx.map(i=>warmCard(day, d.warmup[i], i, doneMap)).join('')
    + strengthEntries.filter(isEntryDone).map(strengthCardHtml).join('');

  const customRows = (log.custom||[]).map(entry => `
    <div class="hist-item-block">
      <div class="hist-item">
        <span class="n">${escapeAttr(entry.name)} <span style="color:var(--ink-dim); font-weight:500;">· ${MUSCLES[entry.muscle]||entry.muscle}</span></span>
        <span class="v">${(entry.sets||[]).map(s=>`${fmtKg(s.kg)||'-'}×${s.reps||'-'}`).join(', ')}</span>
      </div>
    </div>
  `).join('');

  mainEl.innerHTML = `
    <div class="day-head">
      <h2>${d.label} · ${d.sub}</h2>
      <div class="progress">${doneCount}/${total}</div>
    </div>

    ${syncError ? `<div class="storage-note sync-error">${syncError}</div>` : ''}

    ${d.warmup.length ? `<div class="section-label warm">Calentamiento</div>` : ''}
    ${pendingWarmIdx.map(i=>warmCard(day, d.warmup[i], i, doneMap)).join('')}

    <div class="section-label strength">Entrenamiento de fuerza</div>
    ${strengthCardsHtml}

    <div class="section-label cardio">Cardio</div>
    ${cardioCard(day, log.cardio)}

    <div class="section-label strength">Añadir ejercicio</div>
    <div class="card">
      ${customRows || '<div class="prev-history">Nada añadido hoy.</div>'}
    </div>
    ${addExerciseFormHtml('dayadd')}
  `;

  mainEl.querySelectorAll('.check').forEach(chk=>{
    chk.addEventListener('click', async ()=>{
      const card = chk.closest('.card');
      const cardDay = card.dataset.exDay || day;
      const subKey = card.dataset.key.slice(cardDay.length + 1); // strip "${cardDay}-" prefix -> "warm-0" / "strength-2"
      const fresh = await cachedLog(cardDay);
      fresh.done = fresh.done || {};
      fresh.done[subKey] = !fresh.done[subKey];
      await saveLog(cardDay, date, fresh);
      await renderMain();
    });
  });

  wireTipsToggles(mainEl);
  wireThumbButtons();

  mainEl.querySelectorAll('[data-ex-idx][data-set-i]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const exDay = inp.dataset.exDay || day;
      const idx = inp.dataset.exIdx;
      const setI = Number(inp.dataset.setI);
      const field = inp.dataset.field;
      const value = field === 'kg' ? normKg(inp.value) : inp.value;
      const fresh = await cachedLog(exDay);
      fresh.sets = fresh.sets || {};
      const arr = fresh.sets[idx] || (fresh.sets[idx] = []);
      arr[setI] = { ...arr[setI], [field]: value };
      await saveLog(exDay, date, fresh);
      refreshSyncBanner();
    });
  });

  mainEl.querySelectorAll('[data-note-idx]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const exDay = inp.dataset.exDay || day;
      const idx = inp.dataset.noteIdx;
      const fresh = await cachedLog(exDay);
      fresh.notes = fresh.notes || {};
      fresh.notes[idx] = inp.value;
      await saveLog(exDay, date, fresh);
      refreshSyncBanner();
    });
  });

  const minutesEl = mainEl.querySelector('#cardio-minutes');
  const machineEl = mainEl.querySelector('#cardio-machine');
  async function saveCardio(){
    log.cardio = { minutes: minutesEl.value, machine: machineEl.value };
    await saveLog(day, date, log);
    refreshSyncBanner();
  }
  if(minutesEl) minutesEl.addEventListener('change', saveCardio);
  if(machineEl) machineEl.addEventListener('change', saveCardio);

  wireAddExerciseForm('dayadd', async (entry)=>{
    const fresh = await cachedLog(day);
    fresh.custom = fresh.custom || [];
    fresh.custom.push(entry);
    await saveLog(day, date, fresh);
    await renderMain();
  }, `dayadd-${day}-${date}`);
}

// Sets as "40kg×6 · 40kg×6", skipping empty ones — same format for routine,
// trainer and free exercises.
// Read-only look back at a Bloque 1 day: its exercises, each with every session logged
// for it (newest first). No checks or inputs — that block is over.
async function renderBlock1Day(token){
  const day = current;
  const d = DATA[day];
  const logs = (await listAllLogs())
    .filter(l => l.day === day)
    .sort((a,b) => b.date.localeCompare(a.date));
  if(token !== renderToken) return;

  const cards = d.strength.map((ex, idx)=>{
    const sessions = logs
      .map(l => ({ date: l.date, sets: ((l.sets && l.sets[idx]) || []).filter(s => s && (s.kg || s.reps)) }))
      .filter(s => s.sets.length);
    const sessionsHtml = sessions.length
      ? sessions.map(s => `<div class="prev-history"><b>${shortDate(s.date)}:</b> ${escapeAttr(s.sets.map(x => `${fmtKg(x.kg)||'-'}×${x.reps||'-'}`).join(', '))}</div>`).join('')
      : '<div class="prev-history">Sin sesiones registradas</div>';
    return `
    <div class="card ex-card card-strength">
      <div class="ex-photo-wrap ex-photo-wrap--square">
        <button class="thumb-btn ex-photo" type="button" data-name="${escapeAttr(ex.name)}" data-video="${escapeAttr(ex.video)}" data-series="${escapeAttr(ex.series)}" data-rep="${escapeAttr(ex.rep)}" data-recp="${escapeAttr(ex.recp || '')}" data-icon="${escapeAttr(ex.icon || '')}" data-photo="${escapeAttr(ex.photo || '')}" aria-label="Ver detalle de ${escapeAttr(ex.name)}">
          <div class="ex-photo-frame">${thumbHtml(ex)}</div>
          <span class="ex-play-hint">${playIcon()}</span>
        </button>
      </div>
      <div class="ex-body">
        <div class="ex-name">${ex.name}</div>
        ${exStatsHtml(ex)}
        ${sessionsHtml}
      </div>
    </div>`;
  }).join('');

  mainEl.innerHTML = `
    <div class="day-head"><h2>${d.label} · ${d.sub}</h2></div>
    ${syncError ? `<div class="storage-note sync-error">${syncError}</div>` : ''}
    <div class="section-label strength">Entrenamiento de fuerza</div>
    ${cards}
  `;
  wireThumbButtons();
}

function fmtSets(arr){
  return (arr || []).filter(s => s && (s.kg || s.reps)).map(s => `${fmtKg(s.kg)||'-'}kg×${s.reps||'-'}`).join(' · ');
}

function mondayOf(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const dow = (d.getDay() + 6) % 7; // Mon=0..Sun=6
  d.setDate(d.getDate() - dow);
  return d;
}
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function isoWeekKey(dateStr){ return dateKey(mondayOf(dateStr)); }
function lastNWeekKeys(n){
  const mondayToday = mondayOf(todayStr());
  const out = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(mondayToday);
    d.setDate(mondayToday.getDate() - i*7);
    out.push(dateKey(d));
  }
  return out;
}
function weekLabel(weekKey){
  const d = new Date(weekKey + 'T00:00:00');
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

async function renderHistory(token){
  const entries = await listAllLogs();
  entries.sort((a,b)=> b.date.localeCompare(a.date));
  if(token !== renderToken) return;

  mainEl.innerHTML = `<div class="day-head"><h2>Historial</h2></div>${syncError ? `<div class="storage-note sync-error">${syncError}</div>` : ''}<div id="hist-body"></div>`;
  const body = mainEl.querySelector('#hist-body');

  if(entries.length === 0){
    body.innerHTML = `<div class="empty-hist">Todavía no has guardado ningún kg ni cardio.</div>`;
    return;
  }

  // One block per date with every exercise of that date; each row says, in plain
  // dim text, which routine day or trainer session it came from. Routine days
  // first, trainer session last.
  const byDate = new Map();
  entries.forEach(e => {
    if(!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  });

  const dim = text => `<span style="color:var(--ink-dim); font-weight:500;">· ${text}</span>`;

  // The same exercise done more than once on a date (by name, ignoring case) is
  // one row: all its sets in order, every origin it came from, every note below.
  const dateRows = ordered => {
    const items = new Map();
    const legacyRows = [];
    const cardioRows = [];
    const itemFor = (name, origin) => {
      const key = name.trim().toLowerCase();
      if(!items.has(key)) items.set(key, { name: name.trim(), muscle: null, origins: [], sets: [], notes: [] });
      const it = items.get(key);
      if(!it.origins.includes(origin)) it.origins.push(origin);
      return it;
    };
    ordered.forEach(e => {
      const isTrainer = e.day === 'ENTRENADOR';
      const d = isTrainer ? null : DATA[e.day];
      const origin = isTrainer ? 'Entrenador' : `${d.label} · ${d.sub}`;
      // Legacy entries (pre-sets/reps/notes) only ever have a single kg per exercise in "weights".
      Object.entries(e.weights || {})
        .filter(([idx,val]) => val !== undefined && val !== null && val !== "")
        .forEach(([idx,val]) => legacyRows.push(`<div class="hist-item-block"><div class="hist-item"><span class="n">${d.strength[idx] ? d.strength[idx].name : ('Ejercicio '+idx)} ${dim(origin)}</span><span class="v">${fmtKg(val)} kg</span></div></div>`));
      Object.entries(e.sets || {})
        .filter(([idx,arr]) => Array.isArray(arr) && arr.some(s => s && (s.kg || s.reps)))
        .forEach(([idx,arr]) => {
          const it = itemFor(d.strength[idx] ? d.strength[idx].name : ('Ejercicio '+idx), origin);
          it.sets.push(...arr);
          if(e.notes && e.notes[idx]) it.notes.push(e.notes[idx]);
        });
      // Exercises added on the fly (trainer session, or extras like abdominales on a normal day).
      (e.custom || []).forEach(entry => {
        const it = itemFor(entry.name, origin);
        if(!it.muscle && entry.muscle) it.muscle = MUSCLES[entry.muscle] || entry.muscle;
        it.sets.push(...(entry.sets || []));
      });
      if(e.cardio && (e.cardio.minutes || e.cardio.machine)){
        cardioRows.push(`<div class="hist-item-block"><div class="hist-item"><span class="n">Cardio ${e.cardio.machine||''}</span><span class="v">${e.cardio.minutes||'0'} min</span></div></div>`);
      }
    });
    const exerciseRows = [...items.values()].map(it => {
      const tags = [it.muscle, ...it.origins].filter(Boolean).join(' · ');
      const notes = it.notes.map(n => `<div class="hist-note">${escapeAttr(n)}</div>`).join('');
      return `<div class="hist-item-block"><div class="hist-item"><span class="n">${escapeAttr(it.name)} ${dim(tags)}</span><span class="v">${fmtSets(it.sets)}</span></div>${notes}</div>`;
    });
    return legacyRows.join('') + exerciseRows.join('') + cardioRows.join('');
  };

  body.innerHTML = [...byDate.entries()].map(([date, dayEntries])=>{
    const ordered = [...dayEntries.filter(e => e.day !== 'ENTRENADOR'), ...dayEntries.filter(e => e.day === 'ENTRENADOR')];
    const rows = dateRows(ordered);
    return `
      <div class="hist-day">
        <div class="hist-date">${date}</div>
        ${rows || '<div class="empty-hist" style="padding:10px 2px;">Sin datos guardados ese día.</div>'}
      </div>`;
  }).join('');
}

async function renderInformes(token){
  const logs = await listAllLogs();
  if(token !== renderToken) return;

  mainEl.innerHTML = `<div class="day-head"><h2>Informes</h2></div>${syncError ? `<div class="storage-note sync-error">${syncError}</div>` : ''}<div id="informes-body"></div>`;
  const body = mainEl.querySelector('#informes-body');

  // Group by exercise name (ignoring case) across all days of both blocks — a session is a
  // session, wherever it fell in the routine. The current block's spelling of a name wins.
  const exerciseRefs = new Map();
  const displayName = new Map();
  [...DAY_ORDER, ...BLOCK1_ORDER].forEach(day=>{
    DATA[day].strength.forEach((ex, idx)=>{
      const lower = ex.name.toLowerCase();
      if(!displayName.has(lower)){ displayName.set(lower, ex.name); exerciseRefs.set(ex.name, []); }
      exerciseRefs.get(displayName.get(lower)).push({ day, idx });
    });
  });

  // Exercises added on the fly (Entrenador sessions, or free extras on a normal day) aren't
  // tied to a day/idx — fold their sets into the matching catalog exercise by name, or give
  // a brand-new name its own group.
  const customLogs = logs.filter(l => (l.custom||[]).length);
  const knownLower = new Set([...exerciseRefs.keys()].map(n=>n.toLowerCase()));
  customLogs.forEach(l=>{
    (l.custom||[]).forEach(entry=>{
      const trimmed = entry.name.trim();
      if(!knownLower.has(trimmed.toLowerCase())){
        knownLower.add(trimmed.toLowerCase());
        exerciseRefs.set(trimmed, []);
      }
    });
  });

  const exerciseBlocks = [...exerciseRefs.entries()]
    .sort((a,b) => a[0].localeCompare(b[0], 'es'))
    .map(([name, refs])=>{
    const dayHistory = logs
      .flatMap(l => refs.filter(r => r.day === l.day && l.sets && l.sets[r.idx]).map(r=>({ l, idx: r.idx })))
      .flatMap(({l, idx}) => {
        const setsArr = (l.sets[idx] || []).filter(s => s && (s.kg || s.reps));
        return setsArr.map((s, si) => ({ date: l.date, day: l.day, idx, setNum: si+1, kg: s.kg||'', reps: s.reps||'', editable: true }));
      });

    const customHistory = customLogs
      .flatMap(l => (l.custom||[])
        .filter(entry => entry.name.trim().toLowerCase() === name.toLowerCase())
        .flatMap(entry => (entry.sets||[])
          .filter(s => s && (s.kg || s.reps))
          .map((s,si) => ({ date: l.date, day: l.day, tag: l.day === 'ENTRENADOR' ? 'Entrenador' : 'Libre', setNum: si+1, kg: s.kg||'', reps: s.reps||'', editable: false }))));

    // Newest date first; within a date, routine sets then trainer/free ones in the
    // order they were done, numbered 1, 2, 3… across the whole day. setNum stays the
    // set's real position in its own log, which the editable inputs need.
    const history = [...dayHistory, ...customHistory].sort((a,b) => b.date.localeCompare(a.date));
    const perDate = {};
    history.forEach(h => { perDate[h.date] = (perDate[h.date] || 0) + 1; h.n = perDate[h.date]; });

    const rows = history.length
      ? history.map(h => `<tr><td>${h.date}${h.tag ? ` <span style="color:var(--ink-dim); font-weight:500;">· ${h.tag}</span>` : ''}</td><td>Serie ${h.n}</td>` +
          (h.editable
            ? `<td class="num"><input class="info-input" type="text" inputmode="decimal" value="${fmtKg(h.kg)}" data-day="${h.day}" data-date="${h.date}" data-idx="${h.idx}" data-set-i="${h.setNum-1}" data-field="kg" aria-label="Kg, ${escapeAttr(name)}, serie ${h.n}, ${h.date}"></td>` +
              `<td class="num"><input class="info-input" type="number" inputmode="numeric" min="0" step="1" value="${h.reps}" data-day="${h.day}" data-date="${h.date}" data-idx="${h.idx}" data-set-i="${h.setNum-1}" data-field="reps" aria-label="Reps, ${escapeAttr(name)}, serie ${h.n}, ${h.date}"></td>`
            : `<td class="num">${fmtKg(h.kg)||'-'}</td><td class="num">${h.reps||'-'}</td>`
          ) + `</tr>`)
        .join('')
      : `<tr><td colspan="4" style="color:var(--ink-dim); text-align:center; padding:10px 0;">Sin sesiones registradas</td></tr>`;

    return `
      <div class="card">
        <div class="ex-name" style="font-size:14px;">${name}</div>
        <table class="info-table">
          <thead><tr><th>Fecha</th><th>Serie</th><th>Kg</th><th>Reps</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }).join('');

  const weeks = lastNWeekKeys(8);
  const cardioByWeek = {};
  weeks.forEach(w => cardioByWeek[w] = 0);
  logs.forEach(l => {
    const mins = Number(l.cardio && l.cardio.minutes) || 0;
    if(!mins) return;
    const wk = isoWeekKey(l.date);
    if(wk in cardioByWeek) cardioByWeek[wk] += mins;
  });
  const cardioRows = weeks.map(w => `<tr><td>Semana del ${weekLabel(w)}</td><td class="num">${cardioByWeek[w]}</td></tr>`).join('');

  body.innerHTML = `
    <div class="section-label strength">Progresión por ejercicio</div>
    ${exerciseBlocks}
    <div class="section-label cardio">Cardio semanal</div>
    <div class="card">
      <table class="info-table">
        <thead><tr><th>Semana</th><th>Minutos</th></tr></thead>
        <tbody>${cardioRows}</tbody>
      </table>
    </div>
  `;

  // Rows can share the same (day, date) log when several exercises were done the same
  // session, so edits go through one cached object per key instead of re-fetching per
  // field — re-fetching mid-edit is what was losing sets when several were fixed in a row.
  const logCache = new Map();
  logs.forEach(l => logCache.set(`${l.day}:${l.date}`, l));

  body.querySelectorAll('.info-input').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const day = inp.dataset.day;
      const date = inp.dataset.date;
      const idx = inp.dataset.idx;
      const setI = Number(inp.dataset.setI);
      const field = inp.dataset.field;
      const value = field === 'kg' ? normKg(inp.value) : inp.value;
      const key = `${day}:${date}`;
      let cached = logCache.get(key);
      if(!cached){ cached = { weights:{}, cardio:{minutes:"",machine:""}, done:{}, sets:{}, notes:{} }; logCache.set(key, cached); }
      cached.sets = cached.sets || {};
      const arr = cached.sets[idx] || (cached.sets[idx] = []);
      arr[setI] = { ...arr[setI], [field]: value };
      await saveLog(day, date, cached);
      refreshSyncBanner();
    });
  });
}

(async ()=>{
  await getActiveWeekPlan(); // so the "Esta semana" menu knows the saved plan from the first paint
  ensureValidCurrent();
  renderTabs();
  renderMain();
})();
